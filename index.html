const PORTFOLIO = `
CURRENT POSITIONS:
• ASTS (AST SpaceMobile): ~2,122 shares, $0 cost basis (house money). Jan 2027 calls at $75–100 strikes active. $300/share target by 2030. Thesis: direct-to-device satellite broadband, BlueBird constellation deploying, AT&T/Verizon/Claro partnerships, ANATEL Brazil approved May 2026.

const SESSION_SYSTEM = `You are running Matt's daily financial advisor session. Your job is to execute a rigorous four-stage pipeline using live web search, then produce a structured output. The null hypothesis is always NO MOVE — a recommendation must beat it on the merits.

${PORTFOLIO}

INVESTMENT PHILOSOPHY: Conviction-based, long-term growth, high risk tolerance on speculative positions. Asymmetric upside focus. Options used strategically. No Move is a first-class result — never suggest action for its own sake. Honest math over optimism.

PIPELINE:

STAGE 1 – PORTFOLIO PULSE
Review current position health. Any thesis changes? Options to monitor? Overall posture and deployable capital estimate.

STAGE 2 – MARKET SCAN
Search across multiple sources: WSB/Reddit sentiment (Tradestie, AltIndex), unusual options activity, analyst upgrades/initiations/price target changes, and catalyst/news flow. Score each candidate 0–10:
• Social momentum: 0–3 (WSB traction, Reddit, X/Fintwit)
• Short squeeze potential: 0–2 (short float %, days to cover)
• Options flow signal: 0–2 (unusual sweeps — flag low-confidence if web-search only)
• Asymmetric/catalyst: 0–3 (inflection point, analyst initiation, niche catalyst)
Candidates scoring 7+ advance to Stage 3. All others logged but not analyzed.
Also run a pass-through check on: ASTS, PACB, NBIS, RITM, KTOS — any catalyst activity today?
Watchlist names with active catalysts get a lower threshold: 6+ triggers Stage 3.

STAGE 3 – STOCK ANALYSIS (7+ candidates only)
For each qualifying candidate, run full four-pillar analysis using web search:
• Technicals: trend (bullish/bearish/neutral), momentum, key support/resistance levels
• Options: IV%, IV rank (low/medium/high), favorable for buying?, notable unusual activity
• Sentiment: social tone, short interest %, key catalysts surfaced
• Analyst: consensus rating, average price target, recent upgrades/downgrades/initiations
Score asymmetric upside 1–10. Be conservative — 9 or 10 should be rare and requires extraordinary setup.
Note portfolio fit: does this add concentration? Theme overlap? Sizing constraints?

STAGE 4 – SYNTHESIS
Clearance criteria — ALL must be met for a recommendation:
✓ Asymmetric score ≥ 7
✓ Data confidence medium or high
✓ No disqualifying concentration or sizing conflict
✓ IV favorable for proposed trade structure (options plays)
✓ Specific, actionable trade structure exists (not "buy someday")

Multiple recommendations OK only if each independently clears all criteria and they don't conflict in sizing.

OUTPUT FORMAT — use exactly this structure:

═══════════════════════════════════════════════════
DAILY ADVISOR SESSION — [FULL DATE]
═══════════════════════════════════════════════════

SCANNER SUMMARY

───────────────────────────────────────────────────

[IF NOT CLEARED:]

[IF CLEARED — repeat block per recommendation:]
ACTION [#]: [one-line description]
Ticker: [TICKER]
Structure: [exact — e.g. "Buy 5 Jan 2027 $80 calls" or "Buy 200 shares"]
Sizing: [$X — X% of estimated deployable capital]
Conviction: [High | Medium | Low]
Reasoning:
  - [data-backed point]
  - [data-backed point]
  - [data-backed point]
Risks:
  - [specific risk]
  - [specific risk]

[IF MULTIPLE:]
PRIORITY ORDER: Execute #1 first; add #2 only if capital allows after #1.

───────────────────────────────────────────────────
SESSION NOTES
───────────────────────────────────────────────────

After the formatted output, append this block with no extra text:
<SESSION_JSON>
{"null_cleared":BOOL,"recommendation_summary":"STRING","tickers_analyzed":[],"conviction":"High|Medium|Low|N/A","below_threshold":[]}
</SESSION_JSON>`;

const BENCH_SYSTEM = `You are a financial data assistant. The user will ask for ETF percentage returns over a date range. Search for this data and respond with ONLY a valid JSON object and nothing else — no preamble, no explanation, no markdown. Format: {"SPY":NUMBER,"QQQ":NUMBER,"IWM":NUMBER,"ARKK":NUMBER,"XLK":NUMBER} where each NUMBER is the total percentage return as a decimal number (e.g. 5.2 for +5.2%, -3.1 for -3.1%).`;

// ─── Storage (localStorage) ───────────────────────────────────────────────────

async function sGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
async function sSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.error("Storage:", e); }
}
function getApiKey() { return localStorage.getItem("adv-api-key") || ""; }
function saveApiKey(k) { localStorage.setItem("adv-api-key", k); }

// ─── Agent loop ───────────────────────────────────────────────────────────────

async function agentLoop(userMsg, systemPrompt, onStatus) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("No API key set. Click ⚙ in the header to add your Anthropic API key.");
  const messages = [{ role: "user", content: userMsg }];
  for (let i = 0; i < 25; i++) {
    if (onStatus) onStatus(i === 0 ? "Starting pipeline..." : `Researching... (step ${i + 1})`);
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL, max_tokens: 8000, system: systemPrompt, messages,
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    messages.push({ role: "assistant", content: data.content });
    if (data.stop_reason === "end_turn") {
      return data.content.filter(b => b.type === "text").map(b => b.text).join("");
    }
    if (data.stop_reason === "tool_use") {
      // web_search_20250305 is server-side: API populates tool_result blocks in the response.
      // Pass those back so Claude receives the actual search results.
      const serverResults = data.content.filter(b => b.type === "tool_result");
      if (serverResults.length > 0) {
        messages.push({ role: "user", content: serverResults });
      } else {
        const emptyResults = data.content
          .filter(b => b.type === "tool_use")
          .map(b => ({ type: "tool_result", tool_use_id: b.id, content: "" }));
        messages.push({ role: "user", content: emptyResults });
      }
    }
  }
  throw new Error("Session timed out — max search iterations reached.");
}

// ─── Colors / Fonts ───────────────────────────────────────────────────────────

const C = {
  bg:        "#06090d",
  surface:   "#0b1018",
  surface2:  "#101822",
  surface3:  "#141f2b",
  border:    "#1a2840",
  borderHi:  "#243650",
  accent:    "#3dd68c",
  accentDim: "rgba(61,214,140,0.08)",
  accentMid: "rgba(61,214,140,0.15)",
  blue:      "#60a5fa",
  blueDim:   "rgba(96,165,250,0.1)",
  orange:    "#fb923c",
  red:       "#f87171",
  redDim:    "rgba(248,113,113,0.1)",
  gold:      "#fbbf24",
  text:      "#dde6f0",
  muted:     "#4d6480",
  dim:       "#1e3350",
};
const MONO = "'JetBrains Mono','Fira Code','Courier New',monospace";
const SANS = "'IBM Plex Sans','Segoe UI',system-ui,sans-serif";

// ─── Helpers ──────────────────────────────────────────────────────────────────

function pctColor(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return C.muted;
  return n > 0 ? C.accent : n < 0 ? C.red : C.muted;
}
function convColor(c) {
  return c === "High" ? C.accent : c === "Medium" ? C.blue : C.muted;
}
function Badge({ children, color = C.muted }) {
  return (
    <span style={{ fontFamily: MONO, fontSize: 10, color, background: color + "18", border: `1px solid ${color}30`, borderRadius: 3, padding: "2px 7px" }}>
      {children}
    </span>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────

function AdvisorApp() {
  const [tab, setTab]                 = useState("session");
  const [sessions, setSessions]       = useState([]);
  const [trades, setTrades]           = useState([]);
  const [runState, setRunState]       = useState("idle");
  const [output, setOutput]           = useState("");
  const [sessionMeta, setSessionMeta] = useState(null);
  const [status, setStatus]           = useState("");
  const [tradeModal, setTradeModal]   = useState(false);
  const [tradeForm, setTradeForm]     = useState({});
  const [closeModal, setCloseModal]   = useState(null);
  const [closeForm, setCloseForm]     = useState({});
  const [logFilter, setLogFilter]     = useState("all");
  const [expandedId, setExpandedId]   = useState(null);
  const [loaded, setLoaded]           = useState(false);
  const [keyModal, setKeyModal]       = useState(false);
  const [keyInput, setKeyInput]       = useState("");

  // Inject fonts
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap";
    document.head.appendChild(link);
  }, []);

  // Load storage
  useEffect(() => {
    async function load() {
      setSessions(await sGet("adv2-sessions") || []);
      setTrades(await sGet("adv2-trades") || []);
      setLoaded(true);
      if (!getApiKey()) setKeyModal(true);
    }
    load();
  }, []);

  // ── Run session ──────────────────────────────────────────────────────────────
  const runSession = async () => {
    if (!getApiKey()) { setKeyModal(true); return; }
    setRunState("running");
    setOutput("");
    setSessionMeta(null);
    try {
      const today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
      const raw = await agentLoop(`Run today's complete advisor session. Today is ${today}.`, SESSION_SYSTEM, setStatus);
      const clean = raw.replace(/<SESSION_JSON>[\s\S]*?<\/SESSION_JSON>/g, "").trim();
      setOutput(clean);
      let meta = { null_cleared: false, recommendation_summary: "No Move", tickers_analyzed: [], conviction: "N/A", below_threshold: [] };
      const jm = raw.match(/<SESSION_JSON>([\s\S]*?)<\/SESSION_JSON>/);
      if (jm) { try { meta = { ...meta, ...JSON.parse(jm[1].trim()) }; } catch {} }
      setSessionMeta(meta);
      const sess = { id: Date.now().toString(), date: new Date().toISOString(), output: clean, meta };
      const updated = [sess, ...sessions];
      setSessions(updated);
      await sSet("adv2-sessions", updated);
      setRunState("complete");
      setStatus("");
    } catch (e) {
      setRunState("error");
      setStatus(e.message);
    }
  };

  // ── Log trade ────────────────────────────────────────────────────────────────
  const submitTrade = async () => {
    const t = { id: Date.now().toString(), date: new Date().toISOString(), status: "open", pnl: null, pnlPct: null, benchmarks: {}, ...tradeForm };
    const updated = [t, ...trades];
    setTrades(updated);
    await sSet("adv2-trades", updated);
    setTradeModal(false);
    setTradeForm({});
  };

  // ── Close trade ──────────────────────────────────────────────────────────────
  const submitClose = async () => {
    const trade = trades.find(t => t.id === closeModal);
    if (!trade) return;
    const ep = parseFloat(closeForm.exitPrice);
    const en = parseFloat(trade.entryPrice);
    const qty = parseFloat(trade.quantity) || 1;
    const isOptions = trade.structure && (trade.structure.toLowerCase().includes("call") || trade.structure.toLowerCase().includes("put"));
    const mult = isOptions ? 100 : 1;
    const pnl = ((ep - en) * qty * mult).toFixed(2);
    const pnlPct = (((ep - en) / en) * 100).toFixed(2);
    setStatus("Fetching benchmark returns...");
    let benchmarks = {};
    try {
      const entryDate = new Date(trade.date).toLocaleDateString("en-US");
      const br = await agentLoop(
        `What were the total percentage returns for SPY, QQQ, IWM, ARKK, and XLK from ${entryDate} to ${closeForm.exitDate}? Return ONLY the JSON object.`,
        BENCH_SYSTEM, null
      );
      const bm = br.match(/\{[^{}]+\}/);
      if (bm) benchmarks = JSON.parse(bm[0]);
    } catch { benchmarks = {}; }
    setStatus("");
    const updated = trades.map(t => t.id === closeModal
      ? { ...t, status: "closed", exitPrice: closeForm.exitPrice, exitDate: closeForm.exitDate, pnl, pnlPct, benchmarks }
      : t);
    setTrades(updated);
    await sSet("adv2-trades", updated);
    setCloseModal(null);
    setCloseForm({});
  };

  // ── Performance calc ─────────────────────────────────────────────────────────
  const closed = trades.filter(t => t.status === "closed");
  const winRate = closed.length > 0 ? ((closed.filter(t => parseFloat(t.pnlPct) > 0).length / closed.length) * 100).toFixed(0) : null;
  const totalPnl = closed.reduce((s, t) => s + parseFloat(t.pnl || 0), 0);
  const avgReturn = closed.length > 0 ? (closed.reduce((s, t) => s + parseFloat(t.pnlPct || 0), 0) / closed.length).toFixed(1) : null;
  const convData = ["High", "Medium", "Low"].map(c => {
    const ct = closed.filter(t => t.conviction === c);
    const wins = ct.filter(t => parseFloat(t.pnlPct) > 0).length;
    return { name: c, winRate: ct.length > 0 ? parseFloat(((wins / ct.length) * 100).toFixed(0)) : 0, trades: ct.length, avgReturn: ct.length > 0 ? parseFloat((ct.reduce((s, t) => s + parseFloat(t.pnlPct || 0), 0) / ct.length).toFixed(1)) : 0 };
  });
  const benchAlpha = BENCHMARKS.map(b => {
    const pairs = closed.filter(t => t.benchmarks?.[b.id] != null).map(t => parseFloat(t.pnlPct) - t.benchmarks[b.id]);
    const alpha = pairs.length > 0 ? (pairs.reduce((s, v) => s + v, 0) / pairs.length).toFixed(1) : null;
    return { ...b, alpha: alpha != null ? parseFloat(alpha) : null, n: pairs.length };
  });

  // ── Colorize session output ──────────────────────────────────────────────────
  function colorizeOutput(text) {
    return text.split("\n").map((line, i) => {
      let color = C.text;
      if (/^[═─]/.test(line))                                          color = C.dim;
      else if (/^DAILY ADVISOR/.test(line))                            color = C.accent;
      else if (/^NULL HYPOTHESIS/.test(line))                          color = line.includes("Not Cleared") ? C.orange : C.accent;
      else if (/^NO MOVE$/.test(line.trim()))                          color = C.orange;
      else if (/^ACTION/.test(line))                                   color = C.accent;
      else if (/^Ticker:/.test(line))                                  color = C.blue;
      else if (/^Conviction: High/.test(line))                         color = C.accent;
      else if (/^Conviction: Medium/.test(line))                       color = C.blue;
      else if (/^Conviction: Low/.test(line))                          color = C.muted;
      else if (/^Sizing:/.test(line))                                  color = C.gold;
      else if (/^PORTFOLIO PULSE|^SCANNER SUMMARY|^RECOMMENDATION|^SESSION NOTES/.test(line)) color = C.muted;
      return <span key={i} style={{ color, display: "block" }}>{line || " "}</span>;
    });
  }

  // ── Form components ──────────────────────────────────────────────────────────
  const Input = ({ label, field, type = "text", placeholder = "" }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: "block", fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 1, marginBottom: 5 }}>{label}</label>
      <input type={type} value={tradeForm[field] || ""} placeholder={placeholder}
        onChange={e => setTradeForm(f => ({ ...f, [field]: e.target.value }))}
        style={{ width: "100%", boxSizing: "border-box", background: C.surface3, border: `1px solid ${C.border}`, borderRadius: 4, color: C.text, padding: "9px 12px", fontFamily: MONO, fontSize: 12, outline: "none" }} />
    </div>
  );
  const Select = ({ label, field, options }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: "block", fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 1, marginBottom: 5 }}>{label}</label>
      <select value={tradeForm[field] || ""} onChange={e => setTradeForm(f => ({ ...f, [field]: e.target.value }))}
        style={{ width: "100%", boxSizing: "border-box", background: C.surface3, border: `1px solid ${C.border}`, borderRadius: 4, color: C.text, padding: "9px 12px", fontFamily: MONO, fontSize: 12, outline: "none" }}>
        <option value="">Select...</option>
        {options.map(o => <option key={o}>{o}</option>)}
      </select>
    </div>
  );

  if (!loaded) return (
    <div style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.muted, fontFamily: MONO, fontSize: 12, letterSpacing: 2 }}>
      LOADING...
    </div>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: SANS, display: "flex", flexDirection: "column" }}>

      {/* ── Header ── */}
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "0 28px", display: "flex", justifyContent: "space-between", alignItems: "center", height: 52, flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ fontFamily: MONO, fontSize: 15, fontWeight: 700, color: C.accent, letterSpacing: 3 }}>◈ ADVISOR</span>
          <span style={{ width: 1, height: 16, background: C.border }} />
          <span style={{ fontSize: 11, color: C.muted, letterSpacing: 1, fontFamily: MONO }}>DAILY FINANCIAL INTELLIGENCE</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>
            {new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" })}
          </span>
          <button onClick={() => { setKeyInput(getApiKey()); setKeyModal(true); }}
            title="API Key Settings"
            style={{ background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: getApiKey() ? C.accent : C.orange, padding: "5px 10px", cursor: "pointer", fontFamily: MONO, fontSize: 11, lineHeight: 1 }}>
            {getApiKey() ? "⚙" : "⚙ KEY"}
          </button>
        </div>
      </div>

      {/* ── Tab bar ── */}
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, display: "flex", padding: "0 28px", flexShrink: 0 }}>
        {[["session", "SESSION"], ["log", "SESSION LOG"], ["trades", "TRADE JOURNAL"], ["performance", "PERFORMANCE"]].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{ background: "none", border: "none", cursor: "pointer", padding: "14px 20px", fontFamily: MONO, fontSize: 11, fontWeight: 600, letterSpacing: 1, color: tab === id ? C.accent : C.muted, borderBottom: `2px solid ${tab === id ? C.accent : "transparent"}`, marginBottom: -1, transition: "color 0.15s", flexShrink: 0 }}>
            {label}
          </button>
        ))}
      </div>

      {/* ── Content ── */}
      <div style={{ flex: 1, overflowY: "auto", padding: "28px", maxWidth: 920, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>

        {/* ═══ SESSION TAB ═══ */}
        {tab === "session" && (
          <div>
            {runState === "idle" && (
              <div style={{ textAlign: "center", padding: "72px 0" }}>
                <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, letterSpacing: 3, marginBottom: 8 }}>NULL HYPOTHESIS</div>
                <div style={{ fontFamily: MONO, fontSize: 24, fontWeight: 700, color: C.dim, letterSpacing: 4, marginBottom: 40 }}>NO MOVE</div>
                <button onClick={runSession}
                  style={{ background: C.accentDim, border: `1px solid ${C.accent}`, borderRadius: 4, color: C.accent, fontFamily: MONO, fontSize: 13, fontWeight: 700, padding: "16px 56px", cursor: "pointer", letterSpacing: 2 }}
                  onMouseEnter={e => { e.target.style.background = C.accentMid; }}
                  onMouseLeave={e => { e.target.style.background = C.accentDim; }}>
                  RUN TODAY'S SESSION
                </button>
                <div style={{ marginTop: 16, fontFamily: MONO, fontSize: 11, color: C.muted }}>
                  {sessions.length > 0 ? `Last run: ${new Date(sessions[0].date).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}` : "No sessions on record"}
                </div>
                {sessions.length > 0 && (
                  <div style={{ marginTop: 6, fontFamily: MONO, fontSize: 11 }}>
                    <span style={{ color: sessions[0].meta?.null_cleared ? C.accent : C.orange }}>
                      {sessions[0].meta?.null_cleared ? `● ${sessions[0].meta.recommendation_summary}` : "○ No Move"}
                    </span>
                  </div>
                )}
              </div>
            )}

            {runState === "running" && (
              <div style={{ textAlign: "center", padding: "72px 0" }}>
                <div style={{ fontFamily: MONO, fontSize: 12, color: C.accent, marginBottom: 12, letterSpacing: 2 }}>● PIPELINE RUNNING</div>
                <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 32 }}>{status}</div>
                <div style={{ display: "flex", justifyContent: "center", gap: 6 }}>
                  {["1. PORTFOLIO", "2. SCANNER", "3. ANALYSIS", "4. SYNTHESIS"].map(s => (
                    <div key={s} style={{ padding: "7px 14px", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 3, fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 1 }}>{s}</div>
                  ))}
                </div>
              </div>
            )}

            {runState === "error" && (
              <div style={{ textAlign: "center", padding: "72px 0" }}>
                <div style={{ fontFamily: MONO, fontSize: 12, color: C.red, marginBottom: 10 }}>✕ SESSION ERROR</div>
                <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 28, maxWidth: 480, margin: "0 auto 28px" }}>{status}</div>
                <button onClick={() => setRunState("idle")}
                  style={{ background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "10px 28px", cursor: "pointer", fontFamily: MONO, fontSize: 11 }}>
                  RESET
                </button>
              </div>
            )}

            {runState === "complete" && output && (
              <div>
                <pre style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "24px 28px", fontFamily: MONO, fontSize: 11.5, lineHeight: 1.85, whiteSpace: "pre-wrap", wordBreak: "break-word", margin: 0 }}>
                  {colorizeOutput(output)}
                </pre>
                <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                  <button onClick={() => setRunState("idle")}
                    style={{ flex: 1, background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11, letterSpacing: 1 }}>
                    ↺ RESET
                  </button>
                  <button onClick={() => setTab("log")}
                    style={{ flex: 1, background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11, letterSpacing: 1 }}>
                    ≡ VIEW LOG
                  </button>
                  {sessionMeta?.null_cleared && (
                    <button onClick={() => { setTradeModal(true); setTradeForm({ ticker: sessionMeta.tickers_analyzed?.[0] || "", conviction: sessionMeta.conviction || "Medium" }); }}
                      style={{ flex: 2, background: C.accentDim, border: `1px solid ${C.accent}`, borderRadius: 4, color: C.accent, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1 }}>
                      ✓ I EXECUTED THIS — LOG TRADE
                    </button>
                  )}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ═══ LOG TAB ═══ */}
        {tab === "log" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <div style={{ display: "flex", gap: 6 }}>
                {[["all", "ALL"], ["action", "ACTION DAYS"], ["nomove", "NO MOVE"]].map(([id, label]) => (
                  <button key={id} onClick={() => setLogFilter(id)}
                    style={{ background: logFilter === id ? C.accentDim : "none", border: `1px solid ${logFilter === id ? C.accent : C.border}`, borderRadius: 3, color: logFilter === id ? C.accent : C.muted, padding: "6px 14px", cursor: "pointer", fontFamily: MONO, fontSize: 10, letterSpacing: 1 }}>
                    {label}
                  </button>
                ))}
              </div>
              <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{sessions.length} sessions</span>
            </div>
            {sessions.length === 0 && (
              <div style={{ textAlign: "center", padding: "72px 0", fontFamily: MONO, fontSize: 12, color: C.muted }}>No sessions yet.</div>
            )}
            {sessions
              .filter(s => logFilter === "all" ? true : logFilter === "action" ? s.meta?.null_cleared : !s.meta?.null_cleared)
              .map(s => (
                <div key={s.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, marginBottom: 8, overflow: "hidden" }}>
                  <div onClick={() => setExpandedId(expandedId === s.id ? null : s.id)}
                    style={{ padding: "13px 18px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                      <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>
                        {new Date(s.date).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
                      </span>
                      <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 600, color: s.meta?.null_cleared ? C.accent : C.orange }}>
                        {s.meta?.null_cleared ? `● ${s.meta.recommendation_summary || "Action"}` : "○ No Move"}
                      </span>
                      {s.meta?.null_cleared && s.meta?.conviction && <Badge color={convColor(s.meta.conviction)}>{s.meta.conviction}</Badge>}
                    </div>
                    <span style={{ color: C.muted, fontSize: 11, fontFamily: MONO }}>{expandedId === s.id ? "▲" : "▼"}</span>
                  </div>
                  {expandedId === s.id && (
                    <div style={{ borderTop: `1px solid ${C.border}`, padding: "20px 24px" }}>
                      <pre style={{ fontFamily: MONO, fontSize: 11, lineHeight: 1.75, whiteSpace: "pre-wrap", wordBreak: "break-word", margin: 0 }}>
                        {colorizeOutput(s.output)}
                      </pre>
                    </div>
                  )}
                </div>
              ))}
          </div>
        )}

        {/* ═══ TRADES TAB ═══ */}
        {tab === "trades" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
              <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>
                {trades.filter(t => t.status === "open").length} open · {closed.length} closed
              </div>
              <button onClick={() => setTradeModal(true)}
                style={{ background: C.accentDim, border: `1px solid ${C.accent}`, borderRadius: 3, color: C.accent, padding: "8px 18px", cursor: "pointer", fontFamily: MONO, fontSize: 10, fontWeight: 700, letterSpacing: 1 }}>
                + LOG TRADE
              </button>
            </div>

            {trades.filter(t => t.status === "open").length > 0 && (
              <div style={{ marginBottom: 32 }}>
                <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 2, marginBottom: 10, paddingBottom: 8, borderBottom: `1px solid ${C.border}` }}>OPEN POSITIONS</div>
                {trades.filter(t => t.status === "open").map(t => (
                  <div key={t.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "14px 18px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
                      <span style={{ fontFamily: MONO, fontSize: 15, fontWeight: 700, color: C.text }}>{t.ticker}</span>
                      <span style={{ fontSize: 12, color: C.muted }}>{t.structure}</span>
                      {t.strike && <Badge color={C.blue}>${t.strike} {t.expiry}</Badge>}
                      <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{t.quantity} {t.structure?.toLowerCase().includes("call") || t.structure?.toLowerCase().includes("put") ? "contracts" : "shares"} @ ${t.entryPrice}</span>
                      {t.conviction && <Badge color={convColor(t.conviction)}>{t.conviction}</Badge>}
                    </div>
                    <button onClick={() => { setCloseModal(t.id); setCloseForm({ exitDate: new Date().toLocaleDateString("en-US") }); }}
                      style={{ background: "none", border: `1px solid ${C.border}`, borderRadius: 3, color: C.muted, padding: "7px 16px", cursor: "pointer", fontFamily: MONO, fontSize: 10, letterSpacing: 1, flexShrink: 0 }}>
                      CLOSE
                    </button>
                  </div>
                ))}
              </div>
            )}

            {closed.length > 0 && (
              <div>
                <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 2, marginBottom: 10, paddingBottom: 8, borderBottom: `1px solid ${C.border}` }}>CLOSED POSITIONS</div>
                {closed.map(t => {
                  const pct = parseFloat(t.pnlPct);
                  const win = pct > 0;
                  return (
                    <div key={t.id} style={{ background: C.surface, border: `1px solid ${win ? "rgba(61,214,140,0.2)" : "rgba(248,113,113,0.2)"}`, borderRadius: 6, padding: "14px 18px", marginBottom: 8 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                        <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
                          <span style={{ fontFamily: MONO, fontSize: 14, fontWeight: 700 }}>{t.ticker}</span>
                          <span style={{ fontSize: 12, color: C.muted }}>{t.structure}</span>
                          <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted }}>
                            {new Date(t.date).toLocaleDateString("en-US", { month: "short", day: "numeric" })} → {t.exitDate}
                          </span>
                          {t.conviction && <Badge color={convColor(t.conviction)}>{t.conviction}</Badge>}
                        </div>
                        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                          <span style={{ fontFamily: MONO, fontSize: 14, fontWeight: 700, color: win ? C.accent : C.red }}>{win ? "+" : ""}{pct.toFixed(1)}%</span>
                          <span style={{ fontFamily: MONO, fontSize: 12, color: win ? C.accent : C.red }}>{win ? "+" : ""}${t.pnl}</span>
                        </div>
                      </div>
                      {Object.keys(t.benchmarks || {}).length > 0 && (
                        <div style={{ marginTop: 10, display: "flex", gap: 14, flexWrap: "wrap" }}>
                          {BENCHMARKS.map(b => {
                            const bv = t.benchmarks[b.id];
                            if (bv == null) return null;
                            const alpha = (pct - bv).toFixed(1);
                            return (
                              <span key={b.id} style={{ fontFamily: MONO, fontSize: 10, color: parseFloat(alpha) >= 0 ? C.accent : C.red }}>
                                vs {b.id}: {parseFloat(alpha) >= 0 ? "+" : ""}{alpha}%
                              </span>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {trades.length === 0 && (
              <div style={{ textAlign: "center", padding: "72px 0", fontFamily: MONO, fontSize: 12, color: C.muted }}>No trades logged yet.</div>
            )}
          </div>
        )}

        {/* ═══ PERFORMANCE TAB ═══ */}
        {tab === "performance" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 24 }}>
              {[
                ["CLOSED TRADES", closed.length, C.text],
                ["WIN RATE", winRate != null ? winRate + "%" : "—", winRate != null ? (parseFloat(winRate) >= 50 ? C.accent : C.red) : C.muted],
                ["TOTAL P&L", totalPnl !== 0 ? (totalPnl > 0 ? "+" : "") + "$" + Math.abs(totalPnl).toFixed(0) : "—", pctColor(totalPnl)],
                ["AVG RETURN", avgReturn != null ? (parseFloat(avgReturn) > 0 ? "+" : "") + avgReturn + "%" : "—", avgReturn != null ? pctColor(avgReturn) : C.muted],
              ].map(([label, val, color]) => (
                <div key={label} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "16px 18px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 9, color: C.muted, letterSpacing: 1.5, marginBottom: 8 }}>{label}</div>
                  <div style={{ fontFamily: MONO, fontSize: 22, fontWeight: 700, color }}>{val}</div>
                </div>
              ))}
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 24 }}>
              {[
                ["SESSIONS RUN", sessions.length],
                ["ACTION DAYS", sessions.filter(s => s.meta?.null_cleared).length],
                ["NO MOVE DAYS", sessions.filter(s => !s.meta?.null_cleared).length],
              ].map(([label, val]) => (
                <div key={label} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "14px 18px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 9, color: C.muted, letterSpacing: 1.5, marginBottom: 6 }}>{label}</div>
                  <div style={{ fontFamily: MONO, fontSize: 20, fontWeight: 600, color: C.text }}>{val}</div>
                </div>
              ))}
            </div>

            {closed.length === 0 ? (
              <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "48px 0", textAlign: "center" }}>
                <div style={{ fontFamily: MONO, fontSize: 12, color: C.muted, lineHeight: 2 }}>
                  Close your first trade to see performance data.<br />
                  Meaningful signal requires 3–6 months minimum.
                </div>
              </div>
            ) : (
              <>
                <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "20px 24px", marginBottom: 12 }}>
                  <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 2, marginBottom: 18 }}>WIN RATE BY CONVICTION</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    {convData.filter(c => c.trades > 0).map(c => (
                      <div key={c.name} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <span style={{ fontFamily: MONO, fontSize: 11, color: convColor(c.name), width: 56, flexShrink: 0 }}>{c.name}</span>
                        <div style={{ flex: 1, background: C.surface2, borderRadius: 3, height: 10, overflow: "hidden", position: "relative" }}>
                          <div style={{ position: "absolute", left: "50%", top: 0, bottom: 0, width: 1, background: C.border }} />
                          <div style={{ height: "100%", width: `${c.winRate}%`, background: c.winRate >= 50 ? C.accent : C.red, borderRadius: 3 }} />
                        </div>
                        <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 600, color: c.winRate >= 50 ? C.accent : C.red, width: 42, textAlign: "right", flexShrink: 0 }}>{c.winRate}%</span>
                        <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted, width: 36, flexShrink: 0 }}>n={c.trades}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "20px 24px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 2, marginBottom: 18 }}>AVG ALPHA VS BENCHMARKS (per closed trade)</div>
                  {benchAlpha.filter(b => b.n > 0).length === 0 ? (
                    <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>No closed trades with benchmark data yet.</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {benchAlpha.filter(b => b.n > 0).map(b => (
                        <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span style={{ fontFamily: MONO, fontSize: 11, color: b.color, width: 46, flexShrink: 0 }}>{b.id}</span>
                          <div style={{ flex: 1, background: C.surface2, borderRadius: 3, height: 7, overflow: "hidden" }}>
                            <div style={{ height: "100%", width: `${Math.min(Math.abs(b.alpha || 0) * 4, 100)}%`, background: (b.alpha || 0) >= 0 ? C.accent : C.red, borderRadius: 3 }} />
                          </div>
                          <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 600, color: (b.alpha || 0) >= 0 ? C.accent : C.red, width: 64, textAlign: "right", flexShrink: 0 }}>
                            {b.alpha != null ? `${b.alpha >= 0 ? "+" : ""}${b.alpha}%` : "—"}
                          </span>
                          <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted, width: 36, flexShrink: 0 }}>n={b.n}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        )}
      </div>

      {/* ── API Key Modal ── */}
      {keyModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.borderHi}`, borderRadius: 8, padding: 28, width: 440, maxWidth: "92vw" }}>
            <div style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700, color: C.accent, letterSpacing: 2, marginBottom: 6 }}>ANTHROPIC API KEY</div>
            <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, marginBottom: 20, lineHeight: 1.7 }}>
              Your key is stored only in this browser's localStorage. It is never sent anywhere except directly to api.anthropic.com.
            </div>
            <input
              type="password"
              value={keyInput}
              onChange={e => setKeyInput(e.target.value)}
              placeholder="sk-ant-..."
              autoFocus
              style={{ width: "100%", boxSizing: "border-box", background: C.surface3, border: `1px solid ${C.border}`, borderRadius: 4, color: C.text, padding: "10px 14px", fontFamily: MONO, fontSize: 12, outline: "none", marginBottom: 16 }}
            />
            <div style={{ display: "flex", gap: 10 }}>
              {getApiKey() && (
                <button onClick={() => setKeyModal(false)}
                  style={{ flex: 1, background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11 }}>
                  CANCEL
                </button>
              )}
              <button onClick={() => { saveApiKey(keyInput.trim()); setKeyModal(false); }}
                disabled={!keyInput.trim()}
                style={{ flex: 2, background: keyInput.trim() ? C.accentDim : "none", border: `1px solid ${keyInput.trim() ? C.accent : C.border}`, borderRadius: 4, color: keyInput.trim() ? C.accent : C.muted, padding: "11px 0", cursor: keyInput.trim() ? "pointer" : "default", fontFamily: MONO, fontSize: 11, fontWeight: 700 }}>
                SAVE KEY
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Trade Entry Modal ── */}
      {tradeModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.borderHi}`, borderRadius: 8, padding: 28, width: 500, maxWidth: "92vw", maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700, color: C.accent, letterSpacing: 2, marginBottom: 22 }}>LOG TRADE</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
              <Input label="TICKER" field="ticker" placeholder="ASTS" />
              <Select label="STRUCTURE" field="structure" options={["Buy Shares", "Buy Calls", "Buy Puts", "Sell Covered Call"]} />
              <Input label="ENTRY PRICE ($)" field="entryPrice" type="number" placeholder="0.00" />
              <Input label="QUANTITY (shares / contracts)" field="quantity" type="number" placeholder="0" />
              <Input label="STRIKE (options only)" field="strike" placeholder="$80" />
              <Input label="EXPIRY (options only)" field="expiry" placeholder="Jan 2027" />
              <Select label="CONVICTION" field="conviction" options={["High", "Medium", "Low"]} />
              <Input label="ASYMMETRIC SCORE (1–10)" field="asymmetricScore" type="number" placeholder="7" />
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
              <button onClick={() => { setTradeModal(false); setTradeForm({}); }}
                style={{ flex: 1, background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11 }}>
                CANCEL
              </button>
              <button onClick={submitTrade}
                style={{ flex: 2, background: C.accentDim, border: `1px solid ${C.accent}`, borderRadius: 4, color: C.accent, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11, fontWeight: 700 }}>
                SAVE TRADE
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Close Trade Modal ── */}
      {closeModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.borderHi}`, borderRadius: 8, padding: 28, width: 380, maxWidth: "92vw" }}>
            <div style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: 22 }}>CLOSE POSITION</div>
            {status && <div style={{ fontFamily: MONO, fontSize: 11, color: C.accent, marginBottom: 14 }}>{status}</div>}
            {[["EXIT PRICE ($)", "exitPrice", "number"], ["EXIT DATE", "exitDate", "text"]].map(([label, key, type]) => (
              <div key={key} style={{ marginBottom: 14 }}>
                <label style={{ display: "block", fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: 1, marginBottom: 5 }}>{label}</label>
                <input type={type} value={closeForm[key] || ""} onChange={e => setCloseForm(f => ({ ...f, [key]: e.target.value }))}
                  style={{ width: "100%", boxSizing: "border-box", background: C.surface3, border: `1px solid ${C.border}`, borderRadius: 4, color: C.text, padding: "9px 12px", fontFamily: MONO, fontSize: 12, outline: "none" }} />
              </div>
            ))}
            <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, marginBottom: 18, lineHeight: 1.7 }}>
              Benchmark returns (SPY / QQQ / IWM / ARKK / XLK) will be fetched automatically via web search.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => { setCloseModal(null); setCloseForm({}); }}
                style={{ flex: 1, background: "none", border: `1px solid ${C.border}`, borderRadius: 4, color: C.muted, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11 }}>
                CANCEL
              </button>
              <button onClick={submitClose}
                style={{ flex: 2, background: C.redDim, border: `1px solid ${C.red}`, borderRadius: 4, color: C.red, padding: "11px 0", cursor: "pointer", fontFamily: MONO, fontSize: 11, fontWeight: 700 }}>
                CLOSE POSITION
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdvisorApp />);
</script>
</body>
</html>
