<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbital">
<meta name="theme-color" content="#03060e">
<title>Orbital — Dynamic Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#03060e; --bg1:#070d1a; --bg2:#0b1425; --bg3:#0f1c32;
  --b:#1c2d47; --b1:#243a57; --b2:#2d4866;
  --t:#e8f0fe; --t1:#9db4d4; --t2:#5a7a9e; --t3:#344d6b;
  --g:#00e5b0; --g1:#00b889; --y:#ffc041; --r:#ff4560; --pu:#7c6af5; --pk:#f550a0;
  --mono:'JetBrains Mono',monospace;
  --sans:'Space Grotesk',sans-serif;
  --serif:'Playfair Display',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--mono);font-size:12px;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--b1)}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;max-width:960px;margin:0 auto}
#hdr{background:var(--bg1);border-bottom:1px solid var(--b);flex-shrink:0}
#hdr-inner{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
#wordmark{font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--g)}
#wordmark span{color:var(--t2);font-weight:300;font-size:11px;letter-spacing:.08em;margin-left:8px;font-family:var(--mono)}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px;gap:0}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:10px;font-family:var(--sans);font-weight:500;letter-spacing:.05em;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--t2);transition:all .2s;user-select:none;text-transform:uppercase}
.tab:active{opacity:.7}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:16px;padding-bottom:80px;animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card.accent-g{border-color:#00e5b033}
.card.accent-y{border-color:#ffc04133}
.card.accent-r{border-color:#ff456033}
.card.accent-pu{border-color:#7c6af533}

/* Typography */
.label{font-size:9px;color:var(--t2);letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px}
.disp{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;line-height:1}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif);font-style:italic}
.muted{color:var(--t2)}
.dim{color:var(--t3)}

/* Buttons */
.btn{cursor:pointer;border:none;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.04em;padding:9px 16px;border-radius:7px;transition:all .15s;white-space:nowrap;text-transform:uppercase}
.btn:active{transform:scale(.96)}
.btn-g{background:var(--g);color:#03060e}
.btn-g:hover{background:var(--g1)}
.btn-y{background:var(--y);color:#03060e}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--b1)}
.btn-ghost:hover{border-color:var(--b2);color:var(--t)}
.btn-sm{padding:5px 10px;font-size:10px;border-radius:5px}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* Stats */
.stat{background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:10px 12px}
.stat .val{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .sub{font-size:9px;color:var(--t2);margin-top:3px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:6px 8px;color:var(--t3);font-size:9px;letter-spacing:.12em;font-weight:500;border-bottom:1px solid var(--b);text-align:right;text-transform:uppercase;font-family:var(--sans)}
th:first-child{text-align:left}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--b)}
td:first-child{text-align:left}

/* Score bars */
.score-wrap{display:flex;align-items:center;gap:6px}
.score-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width .6s ease}
.score-num{font-family:var(--sans);font-weight:700;font-size:13px;min-width:28px;text-align:right}

/* Signal badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:9px;font-family:var(--sans);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* Progress */
.prog-wrap{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .8s ease}

/* Rows */
.row{background:var(--bg2);border:1px solid var(--b);border-radius:8px;margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.row-hdr{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;user-select:none}
.row-hdr:active{background:var(--bg3)}
.row-body{border-top:1px solid var(--b);padding:12px 14px 14px;display:none}
.row.open .row-body{display:block}

/* Alerts */
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;padding:9px 18px;border-radius:8px;font-size:11px;font-family:var(--sans);font-weight:500;text-align:center;display:none;white-space:nowrap;max-width:90vw}
#toast.show{display:block;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Priority action banner */
.priority-banner{background:linear-gradient(135deg,#00e5b010,#7c6af510);border:1px solid var(--g);border-radius:12px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.priority-banner::before{content:'';position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle,#00e5b015,transparent);border-radius:50%}

/* Opportunity alert */
.opp-alert{background:linear-gradient(135deg,#ffc04112,#f550a012);border:1px solid var(--y);border-radius:10px;padding:14px;margin-bottom:10px}

/* Position health */
.health-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Animations */
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Inputs */
input,select{background:var(--bg3);border:1px solid var(--b);color:var(--t);font-family:var(--mono);font-size:12px;padding:8px 11px;border-radius:7px;width:100%;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:#00e5b044}

/* Separator */
.sep{height:1px;background:var(--b);margin:12px 0}

/* Action items */
.action{display:flex;gap:8px;margin-bottom:6px;font-size:11px;color:var(--t1);line-height:1.6}
.action-n{color:#00e5b044;flex-shrink:0}

@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">
  <div id="hdr">
    <div id="hdr-inner">
      <div>
        <div id="wordmark">ORBITAL <span>DYNAMIC STRATEGY</span></div>

    </div>

      <div class="tab" onclick="showTab('positions')">Positions</div>

  <div id="content"><div class="page" id="page-content"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════════════════════════

// Only actual holdings — everything else discovered through screener
const CORE_POSITIONS = [
  {ticker:'ASTS', shares:2122, basis:0, type:'CORE',
   thesis:'Core engine. $0 basis house money. Hold through thesis break or price triggers.'},

// ASTS-only triggers — all others added dynamically when user marks a screener result as held
const ASTS_TRIGGERS = [

  {ticker:'ASTS', price:200, dir:'above', action:'SPOUSE FREEDOM — sell 1,600 shares → mortgage', pri:'CRITICAL', emoji:'⚡'},
  {ticker:'ASTS', price:150, dir:'above', action:'Sell 400-500 shares → mortgage principal', pri:'HIGH', emoji:'↑'},
  {ticker:'ASTS', price:65,  dir:'below', action:'Thesis check → buy dip from reserve if intact', pri:'HIGH', emoji:'↓'},

// Two distinct pipelines — scored against different benchmarks
// Pipeline A: ASYMMETRIC — small/mid cap, high beta, beaten down, binary catalyst potential
// Pipeline B: BALLAST — large cap, profitable, growing faster than priced, durable moat

const ASYMMETRIC_PRESETS = [
  {id:'deep_value_tech', name:'Deep Value Tech', icon:'⚡', type:'ASYMMETRIC',
   desc:'$100M–$5B, beta 1.5+, tech/healthcare/defense, high volume',
   params:{marketCapMoreThan:1e8,marketCapLowerThan:5e9,betaMoreThan:1.5,volumeMoreThan:200000,country:'US',isEtf:false,limit:45}},
  {id:'fallen_angels', name:'Fallen Angels', icon:'↓', type:'ASYMMETRIC',
   desc:'$50M–$8B, beaten down 40%+, still actively traded',
   params:{marketCapMoreThan:5e7,marketCapLowerThan:8e9,betaMoreThan:1.3,volumeMoreThan:150000,country:'US',isEtf:false,limit:45}},
  {id:'defense_quantum', name:'Defense & Deep Tech', icon:'🛡', type:'ASYMMETRIC',
   desc:'Industrials + Technology, government contract moat potential',
   params:{marketCapMoreThan:1e8,marketCapLowerThan:1e10,betaMoreThan:1.0,volumeMoreThan:100000,sector:'Industrials',country:'US',isEtf:false,limit:40}},
  {id:'biotech_genomics', name:'Biotech & Genomics', icon:'🧬', type:'ASYMMETRIC',
   desc:'Healthcare, mid-cap, binary catalyst setups',
   params:{marketCapMoreThan:5e7,marketCapLowerThan:5e9,betaMoreThan:1.5,volumeMoreThan:100000,sector:'Healthcare',country:'US',isEtf:false,limit:40}},
];

const BALLAST_PRESETS = [
  {id:'quality_compounder', name:'Quality Compounders', icon:'🏛', type:'BALLAST',
   desc:'$10B+, profitable, growing 15%+, strong moat',
   params:{marketCapMoreThan:1e10,marketCapLowerThan:5e12,betaMoreThan:0.5,volumeMoreThan:1000000,country:'US',isEtf:false,limit:40}},
  {id:'global_leaders', name:'Global AI Infrastructure', icon:'🌐', type:'BALLAST',
   desc:'$5B+, Technology sector, AI supply chain, dollar diversification',
   params:{marketCapMoreThan:5e9,marketCapLowerThan:5e12,betaMoreThan:0.8,volumeMoreThan:500000,sector:'Technology',country:'US',isEtf:false,limit:40}},
  {id:'defense_primes', name:'Defense Primes', icon:'⚔', type:'BALLAST',
   desc:'Large defense/industrials, backlog visibility, government moat',
   params:{marketCapMoreThan:5e9,marketCapLowerThan:1e12,betaMoreThan:0.5,volumeMoreThan:300000,sector:'Industrials',country:'US',isEtf:false,limit:40}},
  {id:'financial_infra', name:'Financial Infrastructure', icon:'💳', type:'BALLAST',
   desc:'$5B+, fintech/payments, recurring revenue, network effects',
   params:{marketCapMoreThan:5e9,marketCapLowerThan:5e11,betaMoreThan:0.7,volumeMoreThan:500000,sector:'Financial Services',country:'US',isEtf:false,limit:40}},
];

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════

let fmpKey    = localStorage.getItem('orb3_fmp') || '';
let portfolio = JSON.parse(localStorage.getItem('orb3_port') || 'null') || {
  asts_shares:2122, asts_price:67.82, mortgage_balance:510000,
  mortgage_rate:6.625, monthly_payment:3270, annual_premium_net:20385,
  reserve_balance:10000, last_updated:tod()
};
let liveQuotes    = JSON.parse(localStorage.getItem('orb3_quotes') || '{}');
let screenRes     = JSON.parse(localStorage.getItem('orb3_screen') || '[]');
let screenBallast = JSON.parse(localStorage.getItem('orb3_screen_b') || '[]');
let activeScreenType = localStorage.getItem('orb3_screen_type') || 'ASYMMETRIC';
let intelCache    = JSON.parse(localStorage.getItem('orb3_intel')  || '{}');
let lastScreen    = localStorage.getItem('orb3_last_screen') || null;
let lastAnalyze   = localStorage.getItem('orb3_last_analyze') || null;

// Dynamic positions — ASTS is core, everything else discovered via screener and added by user
let userPositions = JSON.parse(localStorage.getItem('orb3_user_positions') || '[]');
// Dynamic triggers — ASTS triggers always on, user adds triggers for screener discoveries
let userTriggers  = JSON.parse(localStorage.getItem('orb3_user_triggers') || '[]');

// Merged views used throughout app
function getPositions(){ return [...CORE_POSITIONS, ...userPositions]; }
function getPriceTriggers(){ return [...ASTS_TRIGGERS, ...userTriggers]; }
let currentTab   = 'command';
let openRow      = null;
let intelTicker  = 'ASTS';
let analyzing    = false;
let screening    = false;
let intelLoading = false;
let opportunities= [];

function save(){
  localStorage.setItem('orb3_port', JSON.stringify(portfolio));
  localStorage.setItem('orb3_quotes', JSON.stringify(liveQuotes));
  localStorage.setItem('orb3_screen', JSON.stringify(screenRes));

// ═══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════════

function tod(){ return new Date().toISOString().split('T')[0]; }
function now(){ return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function fmt(n){ if(n==null)return'—'; if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B'; if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M'; return'$'+Math.round(n).toLocaleString(); }
function fmtP(n){ if(n==null)return'—'; return(n>=0?'+':'')+n.toFixed(2)+'%'; }
function fmtN(n){ if(n==null)return'—'; if(n>=1e9)return(n/1e9).toFixed(2)+'B'; if(n>=1e6)return(n/1e6).toFixed(2)+'M'; return Math.round(n).toLocaleString(); }

function mortBal(init,pmt,rate,yrs,extra=0){
  let b=init; const mr=rate/12/100; const me=extra/12;
  for(let m=0;m<yrs*12;m++){b-=(pmt-b*mr+me);if(b<=0)return 0;}
  return Math.max(0,b);
}

function getRouting(price,mortBal){
  if(mortBal<=200000)return{label:'Mortgage ≤ $200K',m:0,i:60,a:40,r:0,c:'var(--pu)'};
  if(price>100)return{label:'ASTS above $100',m:50,i:30,a:0,r:20,c:'var(--g)'};
  if(price>=65)return{label:'ASTS $65–100',m:40,i:20,a:40,r:0,c:'var(--y)'};
  return{label:'ASTS below $65',m:20,i:0,a:80,r:0,c:'var(--r)'};
}

let toastT;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  const c={ok:['#00e5b020','#00e5b0','#00e5b0'],info:['#7c6af520','#7c6af5','#7c6af5'],warn:['#ffc04120','#ffc041','#ffc041'],err:['#ff456020','#ff4560','#ff4560']};
  const[bg,br,col]=c[type]||c.ok;
  Object.assign(el.style,{background:bg,border:`1px solid ${br}44`,color:col});
  el.textContent=msg; el.className='show';
  clearTimeout(toastT); toastT=setTimeout(()=>el.className='',4000);
}

function setBtn(loading){
  const b=document.getElementById('refresh-btn');
  if(b){b.textContent=loading?'⟳ Analyzing…':'⟳ Analyze'; b.disabled=loading;}
}

// ═══════════════════════════════════════════════════════════════════════════════
// FMP API
// ═══════════════════════════════════════════════════════════════════════════════

async function fmp(ep){
  if(!fmpKey)throw new Error('no_key');
  const sep=ep.includes('?')?'&':'?';
  const r=await fetch(`https://financialmodelingprep.com/api${ep}${sep}apikey=${fmpKey}`);
  if(!r.ok)throw new Error(`fmp_${r.status}`);
  return r.json();
}

async function fetchQuotes(tickers){
  try{
    const d=await fmp(`/v3/quote/${tickers.join(',')}`);
    const m={};(d||[]).forEach(q=>m[q.symbol]=q);
    return m;
  }catch{return{};}
}

async function runScreener(params){
  // Use stable endpoint with corrected parameter names
  const corrected = {
    ...params,
    country: params.country || 'US',
    isActivelyTrading: true,
    isEtf: false,
    // Fix parameter name: FMP uses marketCapLowerThan not marketCapLessThan
    ...(params.marketCapLessThan ? {marketCapLowerThan: params.marketCapLessThan} : {}),
  };
  // Remove any incorrect param names
  delete corrected.marketCapLessThan;
  const qs = Object.entries(corrected)
    .filter(([,v]) => v !== undefined && v !== null && v !== '')
    .map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  try {
    // Try stable endpoint first, fall back to v3
    let d = await fmp(`/stable/company-screener?${qs}`);
    if (!d || !Array.isArray(d) || d.length === 0) {
      d = await fmp(`/v3/stock-screener?${qs}`);
    }
    return Array.isArray(d) ? d : [];
  } catch(e) {
    console.error('Screener error:', e);
    return [];
  }
}

async function fetchIntelData(ticker){
  const r={ticker,fetchedAt:new Date().toISOString()};
  try{r.news=await fmp(`/v3/stock_news?tickers=${ticker}&limit=6`);}catch{r.news=[];}
  try{r.grades=await fmp(`/v3/grade/${ticker}?limit=6`);}catch{r.grades=[];}
  try{const s=await fmp(`/v3/earnings-surprises/${ticker}`);r.surprises=(s||[]).slice(0,4);}catch{r.surprises=[];}
  try{r.sentiment=await fmp(`/v4/social-sentiment?symbol=${ticker}&limit=3`);}catch{r.sentiment=[];}
  try{r.gradeSummary=await fmp(`/v3/analyst-stock-recommendations/${ticker}?limit=2`);}catch{r.gradeSummary=[];}
  return r;
}

// ═══════════════════════════════════════════════════════════════════════════════
// SCORING ENGINE
// ═══════════════════════════════════════════════════════════════════════════════

function scorePosition(q, pos){
  // Score a held position — how well is the thesis holding?
  let score=5; // start neutral
  const reasons=[];

  if(!q) return {score:5,health:'unknown',reasons:['No price data']};

  const chg=q.changesPercentage||0;
  const hi=q.yearHigh||q.price||1;
  const downFromHigh=((hi-q.price)/hi)*100;
  const mc=(q.marketCap||0)/1e9;

  // Momentum
  if(chg>3){score+=0.5;reasons.push(`Up ${chg.toFixed(1)}% today`);}
  else if(chg<-5){score-=0.5;reasons.push(`Down ${Math.abs(chg).toFixed(1)}% today`);}

  // Entry quality relative to current price
  if(downFromHigh>50){score+=1;reasons.push(`Still ${downFromHigh.toFixed(0)}% below 52W high — room to run`);}
  else if(downFromHigh<5){score-=0.5;reasons.push(`Near 52W high — limited upside from here`);}

  // Liquidity
  if((q.volume||0)>1000000)score+=0.5;

  // PE sanity
  if(q.pe&&q.pe>0&&q.pe<30){score+=0.5;reasons.push(`P/E ${q.pe.toFixed(0)} — reasonable`);}
  else if(q.pe&&q.pe>100){score-=0.5;reasons.push(`P/E ${q.pe.toFixed(0)} — stretched`);}

  const health = score>=7?'strong':score>=5.5?'ok':score>=4?'watch':'weak';
  return {score:Math.min(10,Math.max(0,score)),health,reasons};
}

function scoreAsymmetric(r){
  // Scores a candidate as an ASYMMETRIC opportunity
  // What matters: entry price vs potential, volatility that creates entries,
  // market cap small enough that discovery drives re-rating, moat potential
  let score=0; const reasons=[];

  const price=r.price||0;
  const hi=r.yearHigh||price||1;
  const lo=r.yearLow||0;
  const downFromHigh=hi>0?((hi-price)/hi)*100:0;
  const mc=(r.marketCap||0)/1e6; // millions
  const beta=r.beta||0;
  const vol=r.volume||0;

  // ── Entry quality: asymmetry comes from buying low (0–2.5 pts) ──
  if(downFromHigh>70){score+=2.5;reasons.push(`↓${downFromHigh.toFixed(0)}% from high — maximum asymmetry entry`);}
  else if(downFromHigh>50){score+=2.0;reasons.push(`↓${downFromHigh.toFixed(0)}% from high — deep value`);}
  else if(downFromHigh>30){score+=1.0;reasons.push(`↓${downFromHigh.toFixed(0)}% from high — meaningful dip`);}
  else if(downFromHigh>15){score+=0.5;}
  else if(downFromHigh<5){score-=0.5;reasons.push('Near 52W high — entry risk for asymmetric');}

  // ── Market cap: smaller = more room to re-rate (0–1.5 pts) ──
  if(mc>50&&mc<500){score+=1.5;reasons.push(`$${mc.toFixed(0)}M cap — pre-discovery range`);}
  else if(mc>=500&&mc<2000){score+=1.0;reasons.push(`$${(mc/1000).toFixed(1)}B cap — asymmetric sweet spot`);}
  else if(mc>=2000&&mc<8000){score+=0.5;}
  else if(mc>=8000){score-=0.5;reasons.push('Large cap — limited asymmetric re-rating potential');}

  // ── Beta: volatility creates dip-buying opportunities (0–1 pt) ──
  if(beta>3.0){score+=1.0;reasons.push(`Beta ${beta.toFixed(1)} — extreme vol, creates entries`);}
  else if(beta>2.0){score+=0.75;reasons.push(`Beta ${beta.toFixed(1)} — high volatility`);}
  else if(beta>1.5){score+=0.5;}
  else if(beta<0.8){score-=0.5;reasons.push('Low beta — limited asymmetric upside velocity');}

  // ── Liquidity: must be tradeable (0–1 pt) ──
  if(vol>1000000){score+=1.0;reasons.push('High volume — liquid for position sizing');}
  else if(vol>300000){score+=0.75;}
  else if(vol>100000){score+=0.5;}
  else{score-=0.5;reasons.push('Low volume — liquidity risk');}

  // ── Sector moat potential (0–0.5 pt) ──
  const moatSectors=['Technology','Healthcare','Industrials','Communication Services','Energy'];
  if(moatSectors.includes(r.sector)){score+=0.5;reasons.push(`${r.sector} — moat-capable sector`);}

  // ── Not already a held satellite (0 or -1) ──
  const heldSatellite=getPositions().find(p=>p.ticker===r.symbol&&(p.type==='SATELLITE'||p.type==='CORE'));
  if(heldSatellite){score-=1;reasons.push('Already held as satellite/core');}

  // ── Price sanity — avoid obvious penny stocks ──
  if(price<0.5){score-=1;reasons.push('Sub-$0.50 — penny stock risk');}
  else if(price<2&&mc<50){score-=0.5;}

  return {score:Math.min(10,Math.max(0,score)), reasons, type:'ASYMMETRIC'};
}

function scoreBallast(r){
  // Scores a candidate as a BALLAST position
  // What matters: quality of business, profitable growth faster than priced in,
  // durable moat, reasonable valuation relative to growth, stability
  let score=0; const reasons=[];

  const price=r.price||0;
  const hi=r.yearHigh||price||1;
  const downFromHigh=hi>0?((hi-price)/hi)*100:0;
  const mc=(r.marketCap||0)/1e9; // billions
  const beta=r.beta||0;
  const pe=r.pe||null;
  const vol=r.volume||0;

  // ── Market cap: large enough to be stable anchor (0–1.5 pts) ──
  if(mc>=50&&mc<=500){score+=1.5;reasons.push(`$${mc.toFixed(0)}B cap — large-cap anchor quality`);}
  else if(mc>=10&&mc<50){score+=1.0;reasons.push(`$${mc.toFixed(1)}B cap — mid-large, growing into ballast`);}
  else if(mc>=500){score+=0.75;reasons.push(`$${mc.toFixed(0)}B mega-cap — maximum stability`);}
  else if(mc<5){score-=0.5;reasons.push('Too small for reliable ballast role');}

  // ── Valuation: growing into price matters (0–2 pts) ──
  if(pe&&pe>0&&pe<20){score+=2.0;reasons.push(`P/E ${pe.toFixed(0)} — undervalued for quality`);}
  else if(pe&&pe>0&&pe<35){score+=1.0;reasons.push(`P/E ${pe.toFixed(0)} — reasonable for moat quality`);}
  else if(pe&&pe>0&&pe<50){score+=0.5;}
  else if(pe&&pe>100){score-=0.5;reasons.push(`P/E ${pe.toFixed(0)} — priced for perfection`);}
  else if(!pe||pe<=0){score+=0.5;reasons.push('No P/E — growth stage, check revenue multiple');}

  // ── Dip entry: even ballasts are better bought on weakness (0–1.5 pts) ──
  if(downFromHigh>40){score+=1.5;reasons.push(`↓${downFromHigh.toFixed(0)}% from high — quality on sale`);}
  else if(downFromHigh>20){score+=1.0;reasons.push(`↓${downFromHigh.toFixed(0)}% from high — meaningful discount`);}
  else if(downFromHigh>10){score+=0.5;}
  else{score+=0;reasons.push('Near highs — wait for better entry');}

  // ── Beta: ballast should dampen portfolio volatility (0–1 pt) ──
  if(beta>=0.7&&beta<=1.3){score+=1.0;reasons.push(`Beta ${beta.toFixed(1)} — good ballast stability`);}
  else if(beta>1.3&&beta<=1.8){score+=0.5;reasons.push(`Beta ${beta.toFixed(1)} — slightly elevated but ok`);}
  else if(beta>1.8){score-=0.5;reasons.push(`Beta ${beta.toFixed(1)} — too volatile for ballast role`);}
  else if(beta<0.5&&beta>0){score+=0.75;reasons.push(`Beta ${beta.toFixed(1)} — defensive anchor`);}

  // ── Liquidity: must be easily tradeable (0–1 pt) ──
  if(vol>5000000){score+=1.0;reasons.push('Excellent liquidity — institutional grade');}
  else if(vol>1000000){score+=0.75;}
  else if(vol>300000){score+=0.5;}
  else{score-=0.5;reasons.push('Low volume — unusual for large cap');}

  // ── Sector quality: prefer durable structural demand (0–0.5 pt) ──
  const moatSectors=['Technology','Healthcare','Financial Services','Industrials','Consumer Defensive'];
  if(moatSectors.includes(r.sector)){score+=0.5;reasons.push(`${r.sector} — structural demand sector`);}

  // ── Not already held as ballast ──
  const heldBallast=getPositions().find(p=>p.ticker===r.symbol&&p.type==='BALLAST');
  if(heldBallast){score-=0.5;reasons.push('Already held as ballast');}

  return {score:Math.min(10,Math.max(0,score)), reasons, type:'BALLAST'};
}

function scoreCandidate(r, pipelineType='ASYMMETRIC'){
  // Route to correct scoring pipeline
  if(pipelineType==='BALLAST') return scoreBallast(r);
  return scoreAsymmetric(r);
}

function detectOpportunities(positions, quotes, asymResults, ballastResults){
  const opps=[];
  const allScreen=[...asymResults,...ballastResults];

  // 1. Price triggers fired
  getPriceTriggers().forEach(t=>{
    const q=quotes[t.ticker];
    if(!q)return;
    const fired=t.dir==='above'?q.price>=t.price:q.price<=t.price;
    if(fired)opps.push({
      type:'TRIGGER', priority:t.pri==='CRITICAL'?0:t.pri==='HIGH'?1:2,
      ticker:t.ticker, title:`${t.emoji} ${t.label}`,
      desc:t.action, price:q.price, color:'var(--r)'
    });
  });

  // 2. Held positions deteriorating
  positions.filter(p=>p.shares>0||p.type==='CORE').forEach(p=>{
    const q=quotes[p.ticker];
    if(!q)return;
    const {score,health}=scorePosition(q,p);
    if(health==='weak')opps.push({
      type:'DETERIORATION', priority:1,
      ticker:p.ticker, title:`⚠ ${p.ticker} Health: WEAK`,
      desc:`Score ${score.toFixed(1)}/10 — thesis check required. Consider rotating.`,
      price:q.price, color:'var(--y)'
    });
  });

  // 3. Better asymmetric opportunities vs current satellites
  const satScores=positions.filter(p=>p.type==='SATELLITE').map(p=>{
    const q=quotes[p.ticker]; return q?scorePosition(q,p).score:5;
  });
  const avgSat=satScores.length?satScores.reduce((a,b)=>a+b,0)/satScores.length:5;

  asymResults.slice(0,3).filter(r=>r.score>avgSat+1.5).forEach(c=>{
    opps.push({
      type:'ASYMMETRIC_OPP', priority:2,
      ticker:c.symbol, title:`⬆ Asymmetric: ${c.symbol} (${c.score.toFixed(1)}/10)`,
      desc:`${c.reasons[0]||'Strong setup'} — scores ${(c.score-avgSat).toFixed(1)} above current satellites. Consider rotation.`,
      price:c.price, color:'var(--pu)'
    });
  });

  // 4. Better ballast opportunities vs current ballasts
  const ballastScores=positions.filter(p=>p.type==='BALLAST').map(p=>{
    const q=quotes[p.ticker]; return q?scorePosition(q,p).score:5;
  });
  const avgBallast=ballastScores.length?ballastScores.reduce((a,b)=>a+b,0)/ballastScores.length:5;

  ballastResults.slice(0,2).filter(r=>r.score>avgBallast+1.5).forEach(c=>{
    opps.push({
      type:'BALLAST_OPP', priority:3,
      ticker:c.symbol, title:`🏛 Better Ballast: ${c.symbol} (${c.score.toFixed(1)}/10)`,
      desc:`${c.reasons[0]||'Quality compounder'} — stronger ballast profile than current holdings.`,
      price:c.price, color:'var(--g)'
    });
  });

  // 5. Routing signal change
  const astsPrice=quotes['ASTS']?.price||portfolio.asts_price;
  const routing=getRouting(astsPrice,portfolio.mortgage_balance);
  if(routing.label.includes('below $65')){
    opps.push({
      type:'ROUTING', priority:1,
      ticker:'ASTS', title:'📍 Premium Routing: ASTS Dip Mode',
      desc:`ASTS at $${astsPrice.toFixed(2)} — route 80% of premium to ASTS shares if thesis intact.`,
      price:astsPrice, color:'var(--g)'
    });
  }

  return opps.sort((a,b)=>a.priority-b.priority);
}

// SENTIMENT

function sentimentSignal(data){
  let score=0; const reasons=[];
  const neg=['warning','miss','disappoints','cuts','slumps','fails','lawsuit','fraud','recall','downgrade'];
  const pos=['beats','surges','wins','awarded','partnership','record','raises','upgraded','accelerates','breakthrough'];

  (data.grades||[]).slice(0,3).forEach(g=>{
    const a=(g.action||'').toLowerCase();
    if(a.includes('upgrade')||a.includes('initiated')){score+=1;reasons.push(g.gradingCompany+': upgraded to '+g.newGrade);}
    else if(a.includes('downgrade')){score-=1;reasons.push(g.gradingCompany+': downgraded to '+g.newGrade);}
  });

  (data.news||[]).slice(0,5).forEach(n=>{
    const t=(n.title||'').toLowerCase();
    if(pos.some(w=>t.includes(w)))score+=0.5;
    if(neg.some(w=>t.includes(w)))score-=0.5;
  });

  const ls=(data.sentiment||[])[0];
  if(ls){
    const ss=ls.stocktwitsSentiment||ls.twitterSentiment||0;
    if(ss>0.65){score+=0.5;reasons.push(`Social: bullish ${(ss*100).toFixed(0)}%`);}
    else if(ss<0.4&&ss>0){score-=0.5;reasons.push(`Social: bearish ${(ss*100).toFixed(0)}%`);}
  }

  const clamped=Math.max(-2,Math.min(2,score));
  let signal='neutral';
  if(clamped>=1)signal='bullish';
  else if(clamped<=-1)signal='bearish';
  else if(Math.abs(clamped)>0.3)signal='mixed';
  return{signal,reasons,rawScore:clamped,adjustment:clamped*0.25};
}

async function autoRun(){
  if(analyzing||!fmpKey)return;
  analyzing=true; setBtn(true);
  toast('Analyzing positions + market…','info');

  try{
    // 1. Fetch live quotes for all watchlist tickers
    const tickers=getPositions().map(p=>p.ticker);
    const quotes=await fetchQuotes(tickers);
    Object.assign(liveQuotes,quotes);
    if(quotes.ASTS)portfolio.asts_price=quotes.ASTS.price;
    portfolio.last_updated=tod();

    // 2. Quick background screen — run both pipelines if stale
    if(!lastScreen||Date.now()-new Date(lastScreen)>3600000){
      toast('Running dual-pipeline screen…','info');
      // Asymmetric pipeline
      const rawA=await runScreener(ASYMMETRIC_PRESETS[0].params);
      const topA=rawA.slice(0,20).map(r=>r.symbol);
      if(topA.length){
        const sqA=await fetchQuotes(topA);
        screenRes=rawA.slice(0,20).map(r=>{
          const q=sqA[r.symbol]||{};
          const merged={...r,...q,symbol:r.symbol};
          const {score,reasons,type}=scoreAsymmetric(merged);
          return{...merged,score,reasons,pipelineType:'ASYMMETRIC'};
        }).sort((a,b)=>b.score-a.score);
      }
      // Ballast pipeline
      const rawB=await runScreener(BALLAST_PRESETS[0].params);
      const topB=rawB.slice(0,20).map(r=>r.symbol);
      if(topB.length){
        const sqB=await fetchQuotes(topB);
        screenBallast=rawB.slice(0,20).map(r=>{
          const q=sqB[r.symbol]||{};
          const merged={...r,...q,symbol:r.symbol};
          const {score,reasons,type}=scoreBallast(merged);
          return{...merged,score,reasons,pipelineType:'BALLAST'};
        }).sort((a,b)=>b.score-a.score);
      }
      lastScreen=new Date().toISOString();
      localStorage.setItem('orb3_last_screen',lastScreen);
    }

    // 3. Detect opportunities across both pipelines
    opportunities=detectOpportunities(getPositions(),liveQuotes,screenRes,screenBallast);

    save();
    lastAnalyze=new Date().toLocaleString();
    localStorage.setItem('orb3_last_analyze',lastAnalyze);

    const astsPrice=liveQuotes['ASTS']?.price||portfolio.asts_price;
    toast(`Analysis complete — ASTS $${astsPrice.toFixed(2)} · ${opportunities.length} signal${opportunities.length!==1?'s':''}`, opportunities.length?'warn':'ok');
    render();
  }catch(e){
    console.error(e);
    toast('Fetch failed — check FMP key','err');
  }finally{
    analyzing=false; setBtn(false);
  }
}

async function runScreen(preset){
  if(screening||!fmpKey){toast(fmpKey?'Already screening…':'Add FMP key in Settings','warn');return;}
  screening=true;
  activeScreenType=preset.type||'ASYMMETRIC';
  toast(`Running ${activeScreenType} screen: ${preset.name}…`,'info');
  try{
    const raw=await runScreener(preset.params);
    const topTickers=raw.slice(0,30).map(r=>r.symbol);
    const sq=await fetchQuotes(topTickers);
    const scored=raw.slice(0,30).map(r=>{
      const q=sq[r.symbol]||{};
      const merged={...r,...q,symbol:r.symbol};
      const result=activeScreenType==='BALLAST'?scoreBallast(merged):scoreAsymmetric(merged);
      return{...merged,...result,pipelineType:activeScreenType};
    }).sort((a,b)=>b.score-a.score);

    if(activeScreenType==='BALLAST'){
      screenBallast=scored;
      localStorage.setItem('orb3_screen_b',JSON.stringify(screenBallast));
    } else {
      screenRes=scored;
      localStorage.setItem('orb3_screen',JSON.stringify(screenRes));
    }
    lastScreen=new Date().toISOString();
    localStorage.setItem('orb3_last_screen',lastScreen);
    localStorage.setItem('orb3_screen_type',activeScreenType);
    toast(`${preset.name}: ${raw.length} stocks found, top ${Math.min(30,raw.length)} scored`);
    render();
  }catch(e){toast(`Screen failed: ${e.message||'check FMP key and plan tier'}`, 'err');console.error('Screen error:',e);}
  finally{screening=false;}
}

// ─── PORTFOLIO MANAGEMENT — user adds from screener ──────────────────────────

function addToPortfolio(ticker, name, price, pipelineType){
  if(CORE_POSITIONS.find(p=>p.ticker===ticker)){toast(`${ticker} is your core position`,'warn');return;}
  if(userPositions.find(p=>p.ticker===ticker)){toast(`${ticker} already in portfolio`,'warn');return;}
  const type=pipelineType==='BALLAST'?'BALLAST':'SATELLITE';
  userPositions.push({
    ticker, shares:0, basis:parseFloat(price)||0, type,
    addedAt:new Date().toISOString(), name:name||ticker,
    thesis:`Added from ${pipelineType} screen @ $${parseFloat(price).toFixed(2)}. Update shares and notes after buying.`
  });
  // Auto-create a 2x exit trigger for satellites
  if(type==='SATELLITE'){
    userTriggers.push({
      ticker, price:parseFloat((price*2).toFixed(2)),
      dir:'above', pri:'MEDIUM', emoji:'↑',
      action:`${ticker} 2x from screen entry — evaluate trim`,
      auto:true
    });
  }
  save(); toast(`${ticker} added to portfolio ✓`,'ok'); render();
}

function removeFromPortfolio(ticker){
  userPositions=userPositions.filter(p=>p.ticker!==ticker);
  userTriggers=userTriggers.filter(t=>!(t.ticker===ticker&&t.auto));
  delete liveQuotes[ticker];
  save(); toast(`${ticker} removed`); render();
}

function updatePositionField(ticker,field,value){
  const p=userPositions.find(p=>p.ticker===ticker);
  if(!p)return;
  p[field]=field==='shares'||field==='basis'?parseFloat(value)||0:value;
  save();
}

function removeTrigger(i){
  userTriggers.splice(i,1); save(); render();
}

async function loadIntel(ticker){
  if(intelLoading)return;
  intelLoading=true; intelTicker=ticker; render();
  try{
    const d=await fetchIntelData(ticker);
    intelCache[ticker]=d;
    localStorage.setItem('orb3_intel',JSON.stringify(intelCache));
    toast(`Intel loaded for ${ticker}`);
  }catch{toast('Intel fetch failed','err');}
  intelLoading=false; render();
}

      <div class="label" style="margin-bottom:8px">Live Prices</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">`;
    liveTickers.forEach(p=>{
      const q=liveQuotes[p.ticker];
      const chg=q.changesPercentage||0;
      h+=`<div style="min-width:80px">
        <div style="font-family:var(--sans);font-size:11px;color:var(--t2);margin-bottom:2px">${p.ticker}</div>
        <div style="font-family:var(--sans);font-weight:700;font-size:15px;color:${chg>=0?'var(--g)':'var(--r)'}">$${parseFloat(q.price||0).toFixed(2)}</div>
        <div style="font-size:9px;color:${chg>=0?'var(--g)':'var(--r)'}">${fmtP(chg)}</div>
      </div>`;
    });
    h+='</div></div>';
  }

  // Routing
  h+=`<div class="card accent-g" style="border-color:${routing.c}44">
    <div class="label" style="margin-bottom:7px">Premium Routing — ASTS @ $${portfolio.asts_price}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px">`;
  [['MORTGAGE',routing.m,'var(--g)'],['INDEX',routing.i,'var(--pu)'],['ASTS',routing.a,'var(--y)'],['RESERVE',routing.r,'var(--t3)']].filter(([,v])=>v>0).forEach(([l,v,c])=>{
    h+=`<span style="background:var(--bg3);border-radius:5px;padding:3px 9px;font-size:10px;display:inline-flex;gap:4px"><span style="color:var(--t2)">${l}</span><span style="color:${c};font-weight:600">${v}%</span><span style="color:var(--t3);font-size:9px">$${Math.round(portfolio.annual_premium_net*v/100).toLocaleString()}/yr</span></span>`;
  });
  h+=`</div><div class="serif" style="font-size:11px;color:${routing.c}">${routing.label}</div></div>`;

  // Reserve
  h+=`<div class="card ${res<8000?'accent-y':'accent-g'}" style="margin-bottom:10px">
    <div class="label">Reserve (Ally HYSA)</div>
    <div class="disp" style="font-size:22px;color:${res>=8000?'var(--g)':res>=5000?'var(--y)':'var(--r)'};margin-bottom:4px">${fmt(res)}</div>
    <div style="font-size:10px;color:var(--t2)">${res<8000?'⚠ Below $8K floor — refill before routing premium elsewhere':'Dip-buying fund ready · 3.1% APY'}</div>
  </div>`;

  // Quick edit
  h+=`<div class="card">
    <div class="label" style="margin-bottom:10px">Update Portfolio</div>
    <div class="g2" style="gap:8px;margin-bottom:8px">`;
  [['asts_shares','ASTS Shares'],['asts_price','ASTS Price'],['mortgage_balance','Mortgage ($)'],['reserve_balance','Reserve ($)']].forEach(([k,l])=>{
    h+=`<div><div class="label" style="margin-bottom:3px">${l}</div><input type="number" inputmode="decimal" value="${portfolio[k]||0}" onchange="updatePort('${k}',this.value)"></div>`;
  });
  h+=`</div><div style="font-size:9px;color:var(--t3)">Updated: ${portfolio.last_updated}</div></div>`;

  return h;
}

function updatePort(k,v){portfolio[k]=parseFloat(v)||0;portfolio.last_updated=tod();save();render();}

// getPositions() TAB
// ═══════════════════════════════════════════════════════════════════════════════

function renderPositions(){
  let h='';
  const typeOrder=['CORE','SATELLITE','BALLAST','WATCH'];
  const typeColors={CORE:'var(--g)',SATELLITE:'var(--y)',BALLAST:'var(--pu)',WATCH:'var(--t3)'};
  const healthColors={strong:'var(--g)',ok:'var(--g1)',watch:'var(--y)',weak:'var(--r)',unknown:'var(--t3)'};

  typeOrder.forEach(type=>{
    const items=getPositions().filter(p=>p.type===type);
    if(!items.length)return;
    h+=`<div style="font-size:9px;color:${typeColors[type]};letter-spacing:.15em;margin:${type==='CORE'?0:12}px 0 8px;font-family:var(--sans);font-weight:600;text-transform:uppercase">${type}</div>`;

    items.forEach(pos=>{
      const q=liveQuotes[pos.ticker];
      const {score,health,reasons}=q?scorePosition(q,pos):{score:5,health:'unknown',reasons:[]};
      const isOpen=openRow===pos.ticker+'_pos';
      const chg=q?.changesPercentage||0;
      const hi=q?.yearHigh||null;
      const dfh=hi&&q?.price?((hi-q.price)/hi)*100:null;

      h+=`<div class="row ${isOpen?'open':''}">
        <div class="row-hdr" onclick="openRow=openRow==='${pos.ticker}_pos'?null:'${pos.ticker}_pos';render()">
          <div style="display:flex;gap:10px;flex:1;min-width:0;align-items:flex-start">
            <div class="health-dot" style="background:${healthColors[health]};margin-top:4px"></div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                <span style="font-family:var(--sans);font-weight:700;font-size:15px;color:${typeColors[type]}">${pos.ticker}</span>
                <span style="font-size:9px;color:${typeColors[type]};background:${typeColors[type]}18;padding:2px 6px;border-radius:3px;font-family:var(--sans);font-weight:500">${type}</span>
              </div>
              <div style="font-size:10px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${pos.thesis}</div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:10px">
            ${q?`<div style="font-family:var(--sans);font-weight:700;font-size:16px;color:${chg>=0?'var(--g)':'var(--r)'}">$${parseFloat(q.price).toFixed(2)}</div>
            <div style="font-size:9px;color:${chg>=0?'var(--g)':'var(--r)'}">${fmtP(chg)}</div>
            ${dfh!==null?`<div style="font-size:9px;color:var(--t3)">↓${dfh.toFixed(0)}% hi</div>`:''}`:
            `<div style="font-size:11px;color:var(--t3)">—</div>`}
          </div>
          <div style="margin-left:8px;flex-shrink:0;display:flex;align-items:center;gap:5px">
            <div class="score-wrap" style="width:60px">
              <div class="score-bar"><div class="score-fill" style="width:${score*10}%;background:${score>=7?'var(--g)':score>=5?'var(--y)':'var(--r)'}"></div></div>
              <div class="score-num" style="color:${score>=7?'var(--g)':score>=5?'var(--y)':'var(--r)'}">${score.toFixed(1)}</div>
            </div>
            <span style="font-size:10px;color:var(--t3)">${isOpen?'▲':'▼'}</span>
          </div>
        </div>
        <div class="row-body">
          ${q?`
          <div class="g3" style="margin-bottom:12px">
            <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center">
              <div class="label" style="margin-bottom:2px">Mkt Cap</div>
              <div style="font-family:var(--sans);font-weight:600;font-size:13px">${fmtN(q.marketCap)}</div>
            </div>
            <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center">
              <div class="label" style="margin-bottom:2px">Volume</div>
              <div style="font-family:var(--sans);font-weight:600;font-size:13px">${fmtN(q.volume)}</div>
            </div>
            <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center">
              <div class="label" style="margin-bottom:2px">P/E</div>
              <div style="font-family:var(--sans);font-weight:600;font-size:13px">${q.pe?q.pe.toFixed(1):'—'}</div>
            </div>
          </div>
          ${hi?`
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-bottom:4px">
              <span>$${(q.yearLow||0).toFixed(2)} 52W low</span><span>$${hi.toFixed(2)} 52W high</span>
            </div>
            <div class="prog-wrap"><div class="prog-fill" style="width:${Math.min(((q.price-(q.yearLow||0))/(hi-(q.yearLow||1)))*100,100)}%;background:${typeColors[type]}"></div></div>
          </div>`:''}`:
          '<p style="color:var(--t2);font-size:11px;margin-bottom:10px">Tap Analyze to fetch live data for this position.</p>'}
          ${reasons.length?`<div class="label" style="margin-bottom:5px">Position Assessment</div>
          ${reasons.map(r=>`<div style="font-size:10px;color:var(--t2);margin-bottom:3px">→ ${r}</div>`).join('')}<div class="sep"></div>`:''}
          <div class="label" style="margin-bottom:5px">Thesis</div>
          <div style="font-size:11px;color:var(--t1);line-height:1.7;margin-bottom:10px">${pos.thesis}</div>
          ${pos.type!=='CORE'?`
          <div class="sep"></div>
          <div class="label" style="margin-bottom:7px">Update Position</div>
          <div class="g2" style="gap:7px;margin-bottom:8px">
            <div><div class="label" style="margin-bottom:3px">Shares Held</div>
              <input type="number" inputmode="decimal" value="${pos.shares||0}" onchange="updatePositionField('${pos.ticker}','shares',this.value)"></div>
            <div><div class="label" style="margin-bottom:3px">Cost Basis ($)</div>
              <input type="number" inputmode="decimal" value="${pos.basis||0}" onchange="updatePositionField('${pos.ticker}','basis',this.value)"></div>
          </div>
          <div style="margin-bottom:10px">
            <div class="label" style="margin-bottom:3px">Notes / Thesis</div>
            <input type="text" value="${(pos.thesis||'').replace(/"/g,'&quot;')}" onchange="updatePositionField('${pos.ticker}','thesis',this.value)" style="font-size:11px">
          </div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="intelTicker='${pos.ticker}';showTab('intel')">View Intel →</button>
            <button class="btn btn-sm" style="background:#ff456018;color:var(--r);border:1px solid #ff456033" onclick="if(confirm('Remove ${pos.ticker} from portfolio?'))removeFromPortfolio('${pos.ticker}')">Remove</button>
          </div>`:`
          <button class="btn btn-ghost btn-sm" onclick="intelTicker='${pos.ticker}';showTab('intel')">View Intel →</button>`}
        </div>
      </div>`;
    });
  });

  // Price triggers
  h+=`<div style="font-size:9px;color:var(--t2);letter-spacing:.15em;margin:14px 0 8px;font-family:var(--sans);font-weight:600;text-transform:uppercase">Price Triggers</div>`;

  if(!getPositions().length && !getPriceTriggers().length){
    h+=`<div class="card" style="text-align:center;padding:20px">
      <div style="font-size:12px;color:var(--t3);line-height:1.7">No triggers yet beyond ASTS.<br>Add positions from the Screen tab to auto-generate triggers.</div>
    </div>`;
  } else {
    h+=`<div class="card">`;
    getPriceTriggers().forEach((t,i)=>{
      const allTriggers=getPriceTriggers();
      const q=liveQuotes[t.ticker];
      const price=q?.price;
      const fired=price&&(t.dir==='above'?price>=t.price:price<=t.price);
      const isUserTrigger=userTriggers.includes(t);
      const userIdx=userTriggers.indexOf(t);
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:${i<allTriggers.length-1?'1px solid var(--b)':'none'};gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:${fired?'var(--r)':'var(--t1)'};font-family:var(--sans);font-weight:${fired?600:400}">${t.emoji} ${t.ticker} ${t.dir==='above'?'≥':'<'} $${t.price}</div>
          <div style="font-size:9px;color:var(--t3);margin-top:1px">${t.action}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${price?`<div style="font-size:10px;color:var(--t2)">$${price.toFixed(2)}</div>`:''}
          <div style="font-size:16px;color:${fired?'var(--r)':'var(--b2)'}">${fired?'⚡':'○'}</div>
          ${isUserTrigger?`<button class="btn btn-sm" style="background:transparent;color:var(--t3);border:1px solid var(--b);padding:2px 6px;font-size:9px" onclick="removeTrigger(${userIdx})">✕</button>`:''}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // Add new positions prompt if none added yet
  if(userPositions.length===0){
    h+=`<div class="card" style="margin-top:10px;border-color:var(--pu)33;text-align:center;padding:20px">
      <div style="font-family:var(--sans);font-weight:600;font-size:13px;color:var(--pu);margin-bottom:6px">No positions discovered yet</div>
      <div class="serif" style="font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:10px">Run the screener to find asymmetric and ballast opportunities. The app surfaces the best ones — you decide which to add.</div>
      <button class="btn btn-g btn-sm" onclick="showTab('screen')">Go to Screener →</button>
    </div>`;
  }

  return h;
}

  h+=`<p class="serif" style="font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.6">
    Two scoring pipelines — neither uses analyst ratings as input. Asymmetric scored on entry quality and re-rating potential. Ballast scored on moat quality, valuation, and stability.
  </p>`;

    h+=`<div style="font-size:9px;color:var(--t3);margin-bottom:12px;font-family:var(--mono)">

  // Pipeline toggle

  } else {
    h+=`<div class="card" style="margin-bottom:12px;border-color:var(--g)33;padding:10px 14px">
      <div class="label" style="color:var(--g);margin-bottom:5px">BALLAST PIPELINE — What It Scores</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${[['Market Cap','$5B+ for anchor stability'],['P/E Ratio','Undervalued for growth = bonus points'],['↓52W High','Even quality is better bought on weakness'],['Beta 0.5–1.3','Dampens portfolio volatility'],['Volume','5M+ = institutional grade liquidity'],['Sector','Durable structural demand sectors']].map(([k,v])=>`
        <div style="background:var(--bg3);border-radius:5px;padding:4px 8px">
          <span style="color:var(--g);font-size:9px;font-family:var(--sans);font-weight:600">${k}</span>
          <span style="color:var(--t3);font-size:9px"> · ${v}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Preset buttons
  const presets=viewingBallast?BALLAST_PRESETS:ASYMMETRIC_PRESETS;
  h+=`<div class="g2" style="margin-bottom:14px">`;
  presets.forEach(p=>{
    h+=`<div class="card" style="padding:12px">
      <div style="font-size:16px;margin-bottom:4px">${p.icon}</div>
      <div style="font-family:var(--sans);font-weight:700;font-size:12px;color:${viewingBallast?'var(--g)':'var(--pu)'};margin-bottom:3px">${p.name}</div>
      <div style="font-size:10px;color:var(--t2);margin-bottom:8px;line-height:1.4">${p.desc}</div>
      <button class="btn ${viewingBallast?'btn-g':'btn-ghost'} btn-sm" style="width:100%;${!viewingBallast?'border-color:var(--pu)44;color:var(--pu)':''}" onclick="runScreen(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        ${screening?'<span class="spin">⟳</span>':''} Run
      </button>
    </div>`;
  });
  h+='</div>';

  // Custom screener
  h+=`<div class="card" style="margin-bottom:14px">
    <div class="label" style="margin-bottom:10px">Custom ${viewingBallast?'Ballast':'Asymmetric'} Screen</div>
    <div class="g2" style="gap:8px;margin-bottom:10px">

      <div><div class="label" style="margin-bottom:3px">${viewingBallast?'Min Beta':'Min Beta'}</div><input type="number" id="s-beta" value="${viewingBallast?0.5:1.3}" step="0.1"></div>
      <div><div class="label" style="margin-bottom:3px">Min Volume</div><input type="number" id="s-vol" value="${viewingBallast?500000:100000}"></div>
      <div><div class="label" style="margin-bottom:3px">Sector</div>
        <select id="s-sector">
          <option value="">All Sectors</option>
          <option>Technology</option><option>Healthcare</option>
          <option>Industrials</option><option>Energy</option>
          <option>Consumer Cyclical</option><option>Consumer Defensive</option>
          <option>Financial Services</option><option>Communication Services</option>
        </select>
      </div>
      <div><div class="label" style="margin-bottom:3px">Exchange</div>
        <select id="s-exch"><option value="">All</option><option value="NASDAQ">NASDAQ</option><option value="NYSE">NYSE</option></select>
      </div>
    </div>
    <button class="btn btn-y" onclick="runCustomScreen()" style="width:100%">Run Custom Screen</button>
  </div>`;

  // Results table
  if(activeResults.length){
    const pipeColor=viewingBallast?'var(--g)':'var(--pu)';
    h+=`<div class="label" style="margin-bottom:8px">
      ${viewingBallast?'🏛 Ballast':'⚡ Asymmetric'} Results — ${activeResults.length} scored

      </tr></thead><tbody>`;

      const chg=r.changesPercentage||0;
      const hi=r.yearHigh||r.price||1;
      const dfh=hi>0?((hi-r.price)/hi)*100:0;
      const sc=r.score||0;
      const scColor=sc>=7?'var(--g)':sc>=5?'var(--y)':'var(--r)';
      const metricVal=viewingBallast?(r.pe?r.pe.toFixed(1):'—'):(r.beta||0).toFixed(1);
      const alreadyHeld=getPositions().find(p=>p.ticker===r.symbol);
      h+=`<tr>
        <td style="color:${pipeColor};font-family:var(--sans);font-weight:700">${r.symbol}</td>
        <td>$${parseFloat(r.price||0).toFixed(2)}</td>
        <td style="color:${chg>=0?'var(--g)':'var(--r)'}">${fmtP(chg)}</td>
        <td style="color:var(--t2)">${fmtN(r.marketCap)}</td>
        <td style="color:var(--t2)">${metricVal}</td>
        <td style="color:${dfh>30?'var(--g)':'var(--t2)'}">${dfh.toFixed(0)}%</td>
        <td><div class="score-wrap">
          <div class="score-bar" style="width:32px"><div class="score-fill" style="width:${sc*10}%;background:${scColor}"></div></div>
          <span class="score-num" style="color:${scColor};font-size:12px">${sc.toFixed(1)}</span>
        </div></td>
        <td>
          ${alreadyHeld
            ? `<span style="font-size:9px;color:var(--g)">✓ Held</span>`
            : `<button class="btn btn-sm" style="background:${pipeColor}22;color:${pipeColor};border:1px solid ${pipeColor}44;padding:3px 7px;font-size:9px" onclick="addToPortfolio('${r.symbol}','${(r.name||r.symbol).replace(/'/g,"\\'")}',${r.price||0},'${activeScreenType}')">+ Add</button>`
          }
        </td>
      </tr>`;
    });
    h+='</tbody></table></div>';
    h+=`<div style="font-size:9px;color:var(--t3);margin-top:6px">Click + Add to track in your portfolio. Click ticker for Intel.</div>`;

    // Top 3 picks detail
    if(activeResults.slice(0,3).some(r=>r.reasons?.length)){
      h+=`<div style="font-size:9px;color:var(--t2);letter-spacing:.15em;margin:14px 0 8px;font-family:var(--sans);font-weight:600;text-transform:uppercase">Top Picks — Scoring Detail</div>`;
      activeResults.slice(0,3).forEach((r,i)=>{
        const alreadyHeld=getPositions().find(p=>p.ticker===r.symbol);
        h+=`<div class="card" style="margin-bottom:8px;border-color:${pipeColor}33">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap">

            <span style="font-family:var(--sans);font-weight:700;font-size:16px;color:${r.score>=7?'var(--g)':r.score>=5?'var(--y)':'var(--r)'}">${r.score.toFixed(1)}/10</span>
          </div>
          ${(r.reasons||[]).map(reason=>`<div style="font-size:10px;color:var(--t2);margin-bottom:3px">→ ${reason}</div>`).join('')}
          <div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="intelTicker='${r.symbol}';showTab('intel')">Fetch Intel →</button>
            ${alreadyHeld
              ? `<span style="font-size:10px;color:var(--g);align-self:center">✓ Already in portfolio</span>`
              : `<button class="btn btn-sm" style="background:${pipeColor}22;color:${pipeColor};border:1px solid ${pipeColor}44" onclick="addToPortfolio('${r.symbol}','${(r.name||r.symbol).replace(/'/g,"\\'")}',${r.price||0},'${activeScreenType}')">+ Add to Portfolio</button>`
            }
          </div>
        </div>`;
      });
    }
  } else {
    h+=`<div class="card" style="text-align:center;padding:28px">
      <div style="font-size:20px;margin-bottom:8px">${viewingBallast?'🏛':'⚡'}</div>
      <div style="font-size:12px;color:var(--t3);line-height:1.8">
        No ${viewingBallast?'ballast':'asymmetric'} results yet.<br>
        Select a preset above to run the screen.<br>
        <span class="serif" style="color:var(--t2)">Auto-screens both pipelines on Analyze.</span>
      </div>
    </div>`;
  }

  return h;
}

function runCustomScreen(){
  const viewingBallast=activeScreenType==='BALLAST';
  const preset={
    id:'custom', name:'Custom', icon:'⚙',
    type:activeScreenType,
    desc:'Custom parameters',
    params:{
      marketCapMoreThan:(parseInt(document.getElementById('s-mcmin')?.value)||50)*1e6,
      marketCapLowerThan:(parseInt(document.getElementById('s-mcmax')?.value)||8000)*1e6,
      betaMoreThan:parseFloat(document.getElementById('s-beta')?.value)||1.3,
      volumeMoreThan:parseInt(document.getElementById('s-vol')?.value)||100000,
      country:'US',
      isEtf:false, limit:40,
      ...(document.getElementById('s-sector')?.value?{sector:document.getElementById('s-sector').value}:{}),
      ...(document.getElementById('s-exch')?.value?{exchange:document.getElementById('s-exch').value.toLowerCase()}:{})
    }
  };
  runScreen(preset);
}

function renderIntel(){
  const tickers=getPositions().map(p=>p.ticker);
  const data=intelCache[intelTicker]||null;
  const ss=data?sentimentSignal(data):null;
  const sigC={bullish:'var(--g)',bearish:'var(--r)',mixed:'var(--y)',neutral:'var(--t3)'};
  const sigI={bullish:'↑',bearish:'↓',mixed:'↕',neutral:'—'};
  const neg=['warning','miss','disappoints','cuts','slumps','fails','lawsuit','fraud','recall','downgrade'];
  const pos2=['beats','surges','wins','awarded','partnership','record','raises','upgraded','accelerates'];

  let h=`<p class="serif" style="font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.6">News, grades, earnings surprises, social sentiment. Context layer — fundamentals first, intel second.</p>`;

  // Ticker selector
  h+=`<div class="card" style="margin-bottom:12px">
    <div class="label" style="margin-bottom:8px">Ticker</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">`;
  tickers.forEach(t=>{
    const tc={CORE:'var(--g)',SATELLITE:'var(--y)',BALLAST:'var(--pu)',WATCH:'var(--t3)'}[getPositions().find(p=>p.ticker===t)?.type]||'var(--t3)';
    const isA=t===intelTicker;
    h+=`<button class="btn ${isA?'btn-g':'btn-ghost'} btn-sm" onclick="intelTicker='${t}';render();" style="${isA?'':'border-color:'+tc+'44;color:'+tc}">${t}</button>`;
  });
  h+=`</div>
    <button class="btn btn-y" onclick="loadIntel('${intelTicker}')" style="width:100%" ${intelLoading?'disabled':''}>
      ${intelLoading?'<span class="spin">⟳</span> Fetching…':'⟳ Fetch Intel for '+intelTicker}
    </button>
  </div>`;

  if(!data&&!intelLoading){h+=`<div class="card" style="text-align:center;padding:24px"><div style="color:var(--t3);font-size:12px;line-height:1.7">No intel loaded for ${intelTicker}.<br>Tap Fetch Intel above.</div></div>`;return h;}
  if(intelLoading){h+=`<div class="card" style="text-align:center;padding:28px"><div class="spin" style="font-size:22px;color:var(--g)">⟳</div><div style="color:var(--t3);font-size:12px;margin-top:10px">Fetching…</div></div>`;return h;}

  // Sentiment signal
  if(ss){
    const sc=sigC[ss.signal];
    h+=`<div class="card" style="margin-bottom:10px;border-color:${sc}44">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div><div class="label" style="margin-bottom:5px">Sentiment Signal</div>
          <div class="disp" style="font-size:22px;color:${sc}">${sigI[ss.signal]} ${ss.signal.toUpperCase()}</div>
          <div style="font-size:10px;color:var(--t3);margin-top:3px">Score adjustment: ${ss.adjustment>=0?'+':''}${ss.adjustment.toFixed(2)}</div>
        </div>
        <div style="text-align:right">
          <div class="label">Raw</div>
          <div class="disp" style="font-size:26px;color:${sc}">${ss.rawScore>=0?'+':''}${ss.rawScore.toFixed(1)}</div>
        </div>
      </div>
      ${ss.reasons.length?`<div class="sep"></div>${ss.reasons.map(r=>`<div style="font-size:11px;color:var(--t2);margin-bottom:3px">→ ${r}</div>`).join('')}`:''}
    </div>`;
  }

  // Grade changes
  if(data.grades?.length){
    h+=`<div class="card" style="margin-bottom:10px"><div class="label" style="margin-bottom:10px">Analyst Grade Changes</div>`;
    data.grades.slice(0,5).forEach(g=>{
      const a=(g.action||'').toLowerCase();
      const col=a.includes('upgrade')||a.includes('initiated')?'var(--g)':a.includes('downgrade')?'var(--r)':'var(--y)';
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);gap:8px">
        <div><div style="font-size:11px;color:var(--t)">${g.gradingCompany||'—'}</div>
        <div style="font-size:10px;color:var(--t3)">${g.previousGrade||'—'} → <span style="color:${col}">${g.newGrade||'—'}</span></div></div>
        <div style="text-align:right">
          <div style="font-size:9px;color:${col};text-transform:uppercase;letter-spacing:.06em">${g.action||''}</div>
          <div style="font-size:9px;color:var(--t3)">${g.date||''}</div>
        </div>
      </div>`;
    });
    h+='</div>';
  }

  // Grade summary
  if(data.gradeSummary?.length){
    const gs=data.gradeSummary[0];
    const total=(gs.strongBuy||0)+(gs.buy||0)+(gs.hold||0)+(gs.sell||0)+(gs.strongSell||0);
    if(total>0){
      const bp=Math.round(((gs.strongBuy||0)+(gs.buy||0))/total*100);
      const hp=Math.round((gs.hold||0)/total*100);
      const sp=100-bp-hp;
      h+=`<div class="card" style="margin-bottom:10px"><div class="label" style="margin-bottom:10px">Consensus (${total} analysts)</div>
        <div class="g3">
          <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center"><div class="label" style="color:var(--g)">Buy</div><div class="disp" style="font-size:20px;color:var(--g)">${bp}%</div></div>
          <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center"><div class="label" style="color:var(--y)">Hold</div><div class="disp" style="font-size:20px;color:var(--y)">${hp}%</div></div>
          <div style="background:var(--bg3);border-radius:6px;padding:8px;text-align:center"><div class="label" style="color:var(--r)">Sell</div><div class="disp" style="font-size:20px;color:var(--r)">${sp}%</div></div>
        </div>
        <div class="sep"></div>
        <div style="font-size:10px;color:var(--t3)" class="serif">High Buy% on a beaten-down stock = potential catalyst. High Buy% near 52W high = sell-the-news risk.</div>
      </div>`;
    }
  }

  // Earnings surprises
  if(data.surprises?.length){
    h+=`<div class="card" style="margin-bottom:10px"><div class="label" style="margin-bottom:10px">Earnings Surprise History</div><table>
      <thead><tr><th>Date</th><th>Est EPS</th><th>Actual</th><th>Surprise</th></tr></thead><tbody>`;
    data.surprises.forEach(s=>{
      const diff=s.actualEarningResult-s.estimatedEarning;
      const pd=s.estimatedEarning!==0?(diff/Math.abs(s.estimatedEarning))*100:0;
      const col=diff>=0?'var(--g)':'var(--r)';
      h+=`<tr><td>${s.date||''}</td><td>$${parseFloat(s.estimatedEarning||0).toFixed(3)}</td><td style="color:${col}">$${parseFloat(s.actualEarningResult||0).toFixed(3)}</td><td style="color:${col};font-weight:600">${diff>=0?'+':''}${pd.toFixed(1)}%</td></tr>`;
    });
    const beats=data.surprises.filter(s=>s.actualEarningResult>=s.estimatedEarning).length;
    h+=`</tbody></table><div style="font-size:10px;color:var(--t3);margin-top:8px">Beat rate: ${beats}/${data.surprises.length}</div></div>`;
  }

  // News
  if(data.news?.length){
    h+=`<div class="card" style="margin-bottom:10px"><div class="label" style="margin-bottom:10px">Recent News</div>`;
    data.news.slice(0,6).forEach(n=>{
      const t=n.title||'';
      const isP=pos2.some(w=>t.toLowerCase().includes(w));
      const isN=neg.some(w=>t.toLowerCase().includes(w));
      const col=isP?'var(--g)':isN?'var(--r)':'var(--t)';
      const dot=isP?'var(--g)':isN?'var(--r)':'var(--b2)';
      h+=`<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);align-items:flex-start">
        <div style="width:6px;height:6px;border-radius:50%;background:${dot};flex-shrink:0;margin-top:4px"></div>
        <div style="flex:1;min-width:0"><div style="font-size:11px;color:${col};line-height:1.4;margin-bottom:2px">${t}</div>
        <div style="font-size:9px;color:var(--t3)">${n.publishedDate||''} · ${n.site||''}</div></div>
        ${n.url?`<a href="${n.url}" target="_blank" style="font-size:9px;color:var(--t3);flex-shrink:0;border:1px solid var(--b);padding:2px 6px;border-radius:3px;text-decoration:none">↗</a>`:''}
      </div>`;
    });
    h+='</div>';
  }

  if(data.fetchedAt)h+=`<div style="font-size:9px;color:var(--t3);text-align:center;padding:6px">Fetched: ${new Date(data.fetchedAt).toLocaleString()}</div>`;
  return h;
}

}
function clearFmpKey(){fmpKey='';localStorage.removeItem('orb3_fmp');toast('Key cleared');render();}
